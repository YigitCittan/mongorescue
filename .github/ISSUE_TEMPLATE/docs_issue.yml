name: Documentation issue
description: Report a missing, unclear or wrong documentation page
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or path of the page, for example docs/pitr.md.
      placeholder: https://yigitcittan.github.io/mongorescue/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, unclear or wrong, and what would you expect instead?
    validations:
      required: true
