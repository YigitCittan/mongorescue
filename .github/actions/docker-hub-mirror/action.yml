name: Docker Hub mirror
description: >-
  Points the Linux runner's Docker daemon at a Docker Hub pull-through cache
  (mirror.gcr.io by default, no credentials) and, when credentials are given, logs
  in to Docker Hub, so image pulls do not hit the anonymous pull rate limit. Image
  references and digests stay unchanged: the daemon tries the mirror first and falls
  back to Docker Hub.

inputs:
  mirror:
    description: Registry mirror for Docker Hub images (a daemon `registry-mirrors` entry).
    required: false
    default: https://mirror.gcr.io
  dockerhub-username:
    description: Docker Hub user name. Optional; the login is skipped when it or the token is empty (forks, Dependabot).
    required: false
    default: ''
  dockerhub-token:
    description: Docker Hub read-only access token. Optional; see dockerhub-username.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Add the registry mirror to the Docker daemon
      shell: bash
      env:
        MIRROR: ${{ inputs.mirror }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != Linux ]; then
          echo "::error::the Docker Hub mirror action supports Linux runners only"
          exit 1
        fi
        conf=/etc/docker/daemon.json
        tmp="$(mktemp)"
        # Merge into the existing configuration (the runner image ships one).
        { sudo cat "$conf" 2>/dev/null || true; } | jq -s --arg m "$MIRROR" '
          (.[0] // {}) as $c
          | $c + {"registry-mirrors": ((($c["registry-mirrors"] // []) | map(select(. != $m))) + [$m])}
        ' > "$tmp"
        sudo install -m 0644 "$tmp" "$conf"
        rm -f "$tmp"
        sudo systemctl restart docker
        for _ in $(seq 1 30); do
          docker info >/dev/null 2>&1 && break
          sleep 1
        done
        mirrors="$(docker info --format '{{range .RegistryConfig.Mirrors}}{{println .}}{{end}}')"
        if ! grep -qF "${MIRROR%/}" <<<"$mirrors"; then
          echo "::error::Docker daemon does not list the registry mirror ${MIRROR}"
          exit 1
        fi
        echo "Docker Hub registry mirrors:"
        echo "$mirrors"

    - name: Log in to Docker Hub
      if: inputs.dockerhub-username != '' && inputs.dockerhub-token != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}
