name: ClusterFuzzLite

# Continuous fuzzing of the native Go fuzz targets (FUZZ_TARGETS in the Makefile)
# with ClusterFuzzLite, built as libFuzzer binaries by .clusterfuzzlite/build.sh:
#
# - pull requests: code-change mode, about 5 minutes in total across the targets,
#   starting from the corpus of the batch runs; a crash fails the check and is
#   uploaded as an artifact with a reproducer.
# - daily: batch mode, an hour across the targets, which grows the corpus (kept as
#   a workflow artifact, no storage repository and no secrets).
# - weekly: corpus pruning, which batch mode needs to keep the corpus small.
#
# The nightly workflow still runs every target with Go's own engine (make fuzz).
# No pull_request_target: pull requests from forks build and fuzz with a read-only
# token and no secrets.
on:
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - '**/testdata/fuzz/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite.yml'
  schedule:
    - cron: '17 5 * * *' # daily batch fuzzing, after the nightly run
    - cron: '47 6 * * 0' # weekly corpus pruning, Sunday
  workflow_dispatch:
    inputs:
      mode:
        description: ClusterFuzzLite mode
        type: choice
        options:
          - batch
          - prune
        default: batch

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    name: Fuzz pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # download the corpus and builds of earlier runs (workflow artifacts)
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: code-change
          fuzz-seconds: 300
          sanitizer: address

  batch:
    name: Batch fuzzing
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 5 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'batch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write # read the corpus artifacts and delete untrusted ones (see below)
    steps:
      # Corpus trust. Without a storage repository (which would need a token
      # secret), ClusterFuzzLite keeps the corpus as workflow artifacts named
      # cifuzz-corpus-<target> and picks the newest artifact of that name in the
      # whole repository; it cannot filter by branch or event. Code-change runs
      # (the pr job) never upload a corpus, but a pull request from a fork runs
      # its own copy of this workflow and could upload an artifact with that name
      # to plant inputs. So before the trusted jobs read the corpus, every corpus
      # artifact that was not written by a schedule or workflow_dispatch run of
      # this workflow on main in this repository is deleted (actions: write).
      # What remains is data, never code: a planted input can only make a fuzz
      # target built from main fail or waste time, and one uploaded in the
      # seconds between this step and the download is caught by the next run.
      - name: Drop corpus artifacts from untrusted runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A verdict=()
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("cifuzz-corpus-")) | "\(.id) \(.workflow_run.id // "none")"' |
          while read -r id run; do
            if [ -z "${verdict[$run]+x}" ]; then
              verdict[$run]=untrusted
              if [ "$run" != none ]; then
                info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
                  --jq '"\(.event) \(.head_branch) \(.head_repository.full_name) \(.path)"' 2>/dev/null || true)
                read -r event branch repo path <<<"$info"
                case "$event" in
                  schedule | workflow_dispatch)
                    if [ "$branch" = main ] && [ "$repo" = "$GITHUB_REPOSITORY" ] && [ "${path%%@*}" = .github/workflows/cflite.yml ]; then
                      verdict[$run]=trusted
                    fi ;;
                esac
              fi
            fi
            if [ "${verdict[$run]}" != trusted ]; then
              echo "Deleting corpus artifact $id from untrusted run $run"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: batch
          fuzz-seconds: 3600
          sanitizer: address

  prune:
    name: Corpus pruning
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 6 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'prune')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # read the corpus artifacts and delete untrusted ones (see below)
    steps:
      # Corpus trust. Without a storage repository (which would need a token
      # secret), ClusterFuzzLite keeps the corpus as workflow artifacts named
      # cifuzz-corpus-<target> and picks the newest artifact of that name in the
      # whole repository; it cannot filter by branch or event. Code-change runs
      # (the pr job) never upload a corpus, but a pull request from a fork runs
      # its own copy of this workflow and could upload an artifact with that name
      # to plant inputs. So before the trusted jobs read the corpus, every corpus
      # artifact that was not written by a schedule or workflow_dispatch run of
      # this workflow on main in this repository is deleted (actions: write).
      # What remains is data, never code: a planted input can only make a fuzz
      # target built from main fail or waste time, and one uploaded in the
      # seconds between this step and the download is caught by the next run.
      - name: Drop corpus artifacts from untrusted runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A verdict=()
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("cifuzz-corpus-")) | "\(.id) \(.workflow_run.id // "none")"' |
          while read -r id run; do
            if [ -z "${verdict[$run]+x}" ]; then
              verdict[$run]=untrusted
              if [ "$run" != none ]; then
                info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
                  --jq '"\(.event) \(.head_branch) \(.head_repository.full_name) \(.path)"' 2>/dev/null || true)
                read -r event branch repo path <<<"$info"
                case "$event" in
                  schedule | workflow_dispatch)
                    if [ "$branch" = main ] && [ "$repo" = "$GITHUB_REPOSITORY" ] && [ "${path%%@*}" = .github/workflows/cflite.yml ]; then
                      verdict[$run]=trusted
                    fi ;;
                esac
              fi
            fi
            if [ "${verdict[$run]}" != trusted ]; then
              echo "Deleting corpus artifact $id from untrusted run $run"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune corpus
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: prune
          fuzz-seconds: 600
          sanitizer: address
