name: Docker Image Pipeline

# Two entry points:
#  - a push to main publishes the edge and sha-<commit> tags;
#  - the release workflow calls this one on a version tag (workflow_call). That build
#    pushes only sha-<commit>; the release workflow promotes the same digest to
#    <version>, <major>.<minor> and latest once the release succeeded, right before
#    it publishes the GitHub release. Signatures and attestations follow the digest,
#    so promotion does not re-sign.
# Keeping the build in this file keeps the signing identity the same everywhere:
# .github/workflows/docker.yml@refs/heads/main or @refs/tags/v...
on:
  push:
    branches: [main]
  workflow_call:
    outputs:
      digest:
        description: Digest of the pushed image index
        value: ${{ jobs.docker-build-push.outputs.digest }}
      image:
        description: Image name without tag (lowercase GHCR path)
        value: ${{ jobs.docker-build-push.outputs.image }}

permissions:
  contents: read

# Serialize pushes per ref so an older build never overwrites a newer tag. The group
# differs from the release workflow's, which calls this one.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-build-push:
    name: Build & Push Multi-Arch Container Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing of the provenance attestation and the cosign signature
      attestations: write # store the attestation
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (Multi-Arch Emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The container builder does not use the daemon's registry-mirrors; give
          # BuildKit the same Docker Hub mirror for the Dockerfile's base images.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the Go toolchain version
        id: goversion
        run: echo "version=$(tr -d '[:space:]' < .go-version)" >> "$GITHUB_OUTPUT"

      - name: Read the release version
        id: release
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The commit time makes the binary's build date, and so the binary, reproducible.
      - name: Read the commit time
        id: commit
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Normalize Image Name
        id: name
        # GHCR requires lowercase repository names.
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and Push Multi-Arch Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The binary reports the release version on tag builds and "dev" otherwise.
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.release.outputs.version || 'dev' }}
            COMMIT=${{ github.sha }}
            GO_VERSION=${{ steps.goversion.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.commit.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit SLSA provenance and SPDX SBOM, attached to the image index.
          provenance: mode=max
          sbom: true

      - name: Attest Image Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless cosign signature of the image index, by digest (never by tag, which
      # can move), stored in GHCR next to the image. Verification:
      # docs/security.md#verifying-releases.
      - name: Sign the image (cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
