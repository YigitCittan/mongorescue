name: Helm

# The Helm chart (deploy/helm/mongorescue): lint, render and schema-validate it, and
# install it on a kind cluster with a MongoDB pod, and (on pull requests) require a
# chart version bump for chart changes. The job names "Helm lint", "Helm (kind)" and
# "Helm chart version" are what branch protection refers to as required checks: do not
# rename them without updating the ruleset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned tool versions; downloads are checked against these SHA-256 sums.
  HELM_VERSION: v4.3.0
  HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  KUBECTL_VERSION: v1.37.0
  KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
  # Kubernetes version the manifests are validated against, and the pinned commit of
  # the CRD schema catalog (ServiceMonitor, PrometheusRule).
  KUBE_SCHEMA_VERSION: 1.37.0
  CRD_CATALOG_REF: 4c8dc296d32b06d15ccde9668ff136c951f4d539

jobs:
  version:
    name: Helm chart version
    # A push to main has nothing to compare with; a skipped job counts as passed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Rule: docs/versioning.md#helm-chart-versions.
      - name: The chart version increased if the chart changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check-chart-version.sh "origin/${BASE_REF}"

  lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install helm and kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          install -m 0755 linux-amd64/helm bin/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          install -m 0755 kubeconform bin/kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: The chart's alert rules match deploy/prometheus/alerts.yml
        run: diff -u deploy/prometheus/alerts.yml deploy/helm/mongorescue/files/alerts.yml

      - name: helm lint
        run: |
          helm lint --strict deploy/helm/mongorescue
          helm lint --strict deploy/helm/mongorescue -f deploy/helm/mongorescue/ci/full-values.yaml

      - name: helm template + kubeconform
        run: |
          set -euo pipefail
          helm template smoke deploy/helm/mongorescue > "$RUNNER_TEMP/default.yaml"
          helm template smoke deploy/helm/mongorescue -f deploy/helm/mongorescue/ci/full-values.yaml > "$RUNNER_TEMP/full.yaml"
          helm template smoke deploy/helm/mongorescue --set secretKey.generate=false --set persistence.enabled=false \
            --set backups.persistence.enabled=false > "$RUNNER_TEMP/ephemeral.yaml"
          # The template language is kubeconform's, not the shell's.
          # shellcheck disable=SC2016
          kubeconform -strict -summary -kubernetes-version "$KUBE_SCHEMA_VERSION" \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_REF}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "$RUNNER_TEMP/default.yaml" "$RUNNER_TEMP/full.yaml" "$RUNNER_TEMP/ephemeral.yaml"

      - name: helm package (the release workflow's command)
        run: |
          set -euo pipefail
          helm package deploy/helm/mongorescue --app-version 0.0.0-ci --destination "$RUNNER_TEMP/chart"
          helm show chart "$RUNNER_TEMP"/chart/mongorescue-*.tgz | grep -qx 'appVersion: 0.0.0-ci'

      - name: The values schema refuses invalid values
        run: |
          if helm template smoke deploy/helm/mongorescue --set config.logLevel=loud >/dev/null 2>&1; then
            echo "an invalid log level was accepted"; exit 1
          fi
          if helm template smoke deploy/helm/mongorescue --set unknownKey=1 >/dev/null 2>&1; then
            echo "an unknown top-level value was accepted"; exit 1
          fi

      - name: HA probes, shared Service and spread render as documented
        run: |
          set -euo pipefail
          ha=(smoke deploy/helm/mongorescue --set secretKey.existingSecret=mongorescue-key
              --set ha.enabled=true --set ha.target=s3://mongorescue-ha/prod --set ha.cluster=prod)
          # Only the readiness probe changes with ha.readinessActiveOnly: liveness
          # and startup keep /api/v1/health, so a standby is alive but not Ready.
          probe_paths() { awk '/(startup|liveness|readiness)Probe:/ {p=$1} /path: \/api\/v1\// {print p, $2}' "$1"; }
          helm template "${ha[@]}" > "$RUNNER_TEMP/ha-default.yaml"
          helm template "${ha[@]}" --set ha.readinessActiveOnly=true > "$RUNNER_TEMP/ha-ready.yaml"
          probe_paths "$RUNNER_TEMP/ha-default.yaml" | sort > "$RUNNER_TEMP/p-default.txt"
          probe_paths "$RUNNER_TEMP/ha-ready.yaml" | sort > "$RUNNER_TEMP/p-ready.txt"
          grep -qx 'readinessProbe: /api/v1/health' "$RUNNER_TEMP/p-default.txt"
          grep -qx 'readinessProbe: /api/v1/ready' "$RUNNER_TEMP/p-ready.txt"
          grep -qx 'livenessProbe: /api/v1/health' "$RUNNER_TEMP/p-ready.txt"
          grep -qx 'startupProbe: /api/v1/health' "$RUNNER_TEMP/p-ready.txt"
          # The pods of an HA release carry the cluster label; no shared Service by default.
          grep -q 'mongorescue.io/ha-cluster: "prod"' "$RUNNER_TEMP/ha-default.yaml"
          if grep -q 'name: mongorescue-prod$' "$RUNNER_TEMP/ha-default.yaml"; then
            echo "a shared Service was rendered without ha.sharedService.enabled"; exit 1
          fi
          helm template "${ha[@]}" --set ha.sharedService.enabled=true > "$RUNNER_TEMP/ha-svc.yaml"
          grep -q 'name: mongorescue-prod$' "$RUNNER_TEMP/ha-svc.yaml"
          # Outside HA the probes never change and the opt-ins are refused.
          helm template smoke deploy/helm/mongorescue > "$RUNNER_TEMP/plain.yaml"
          if grep -q 'path: /api/v1/ready' "$RUNNER_TEMP/plain.yaml"; then
            echo "a non-HA release probes /ready"; exit 1
          fi
          if helm template smoke deploy/helm/mongorescue --set ha.readinessActiveOnly=true >/dev/null 2>&1; then
            echo "ha.readinessActiveOnly was accepted without ha.enabled"; exit 1
          fi
          if helm template "${ha[@]}" --set ha.sharedService.type=ExternalName >/dev/null 2>&1; then
            echo "an invalid shared Service type was accepted"; exit 1
          fi

      - name: GitOps mode renders deterministically or fails with an actionable message
        run: |
          set -euo pipefail
          args=(smoke deploy/helm/mongorescue --set secretKey.requireExternal=true)
          helm template "${args[@]}" --set secretKey.existingSecret=mongorescue-key > "$RUNNER_TEMP/gitops-1.yaml"
          helm template "${args[@]}" --set secretKey.existingSecret=mongorescue-key > "$RUNNER_TEMP/gitops-2.yaml"
          diff -u "$RUNNER_TEMP/gitops-1.yaml" "$RUNNER_TEMP/gitops-2.yaml"
          if grep -q 'kind: Secret' "$RUNNER_TEMP/gitops-1.yaml"; then
            echo "the GitOps render holds a Secret of its own"; exit 1
          fi
          helm template "${args[@]}" --set keyWrap=aws-kms:arn:aws:kms:eu-central-1:123456789012:alias/mongorescue >/dev/null
          if out=$(helm template "${args[@]}" 2>&1); then
            echo "requireExternal rendered without existingSecret or keyWrap"; exit 1
          fi
          echo "$out" | grep -q 'secretKey.requireExternal is set: set secretKey.existingSecret' || { echo "$out"; exit 1; }

  kind:
    name: Helm (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install kind, kubectl and helm
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          install -m 0755 kind bin/kind
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          install -m 0755 kubectl bin/kubectl
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          install -m 0755 linux-amd64/helm bin/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the chart on kind and run a backup
        run: ./scripts/test-helm-kind.sh
        env:
          KIND_CLUSTER: mongorescue-ci
          # The MongoDB pod's image is pulled by containerd in the kind node, which
          # does not use the host daemon's registry-mirrors.
          DOCKER_HUB_MIRROR: https://mirror.gcr.io
