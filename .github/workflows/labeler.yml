name: PR Labeler

# pull_request_target so fork PRs can be labelled. The job never checks out or
# executes pull request code; the label rules are read from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply Area Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read # read .github/labeler.yml
      pull-requests: write # add labels
    steps:
      - name: Label by Changed Paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
