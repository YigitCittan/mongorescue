name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a release that is already publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # keyless signing of the provenance attestation and the cosign signatures
      attestations: write # store the attestation
    outputs:
      # sha256sum lines of the archives and checksums.txt, base64-encoded: the
      # subjects of the SLSA provenance (job provenance).
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.hash.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The release toolchain: .go-version, shared with CI, the image and govulncheck.
          go-version-file: .go-version
          # No build cache in the release: signed and attested artifacts are built
          # from a clean module and build cache (zizmor cache-poisoning).
          cache: false

      - name: Install Syft (SBOM generator used by GoReleaser)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # GoReleaser's signs section runs cosign sign-blob keyless (GitHub OIDC,
      # Fulcio certificate, Rekor entry) on every archive, SBOM and checksums.txt
      # and uploads one <asset>.sigstore.json bundle per asset.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The release body is the CHANGELOG.md section of the tagged version; a
      # missing or empty section fails the release.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/changelog-section.sh "$TAG" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Release Artifact Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt

      - name: Hash release artifacts for the SLSA provenance
        id: hash
        env:
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "hashes=$(sha256sum -- *.tar.gz *.zip checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  # The container image of the tag, built, attested and signed by digest by the image
  # workflow (a reusable workflow, so its signing identity stays docker.yml). It is
  # pushed as sha-<commit> only; desktop-checksums promotes that digest to the version
  # tags and latest right before it publishes the release, so a version tag never
  # exists for a release that failed, and the image (the Helm chart's default
  # image.tag is the appVersion) exists before the release is visible.
  image:
    name: Container Image
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing of the attestation and the cosign signature
      attestations: write # store the attestation
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  # Release verification (scripts/release-verify.sh; docs/testing.md#release-verification).
  # What the release is about to publish must run: a broken ldflag, a missing embed or
  # an architecture-specific crash fails here, and because desktop-checksums needs
  # these jobs, it fails before the image is promoted and the release is published:
  # the release stays a draft and the version image tags never exist.
  #
  # Every produced archive is downloaded from the draft release, checked against
  # checksums.txt, unpacked and started: --version matches the tag, the server boots
  # on an empty temporary data directory, /api/v1/health answers 200 and the embedded
  # dashboard is served. Native runners for every OS and architecture, no emulation.
  verify-archives:
    name: Verify archive (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write # download the assets of the draft release
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.goreleaser.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      EXT: ${{ matrix.ext }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, ext: tar.gz }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64, ext: tar.gz }
          - { os: macos-15-intel, goos: darwin, goarch: amd64, ext: tar.gz }
          - { os: macos-latest, goos: darwin, goarch: arm64, ext: tar.gz }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: zip }
          - { os: windows-11-arm, goos: windows, goarch: arm64, ext: zip }
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archive and check its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="mongorescue_${VERSION}_${GOOS}_${GOARCH}.${EXT}"
          mkdir verify-dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-dl -p "$asset" -p checksums.txt
          cd verify-dl
          grep " ${asset}\$" checksums.txt > check.txt
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c check.txt; else shasum -a 256 -c check.txt; fi

      - name: Unpack (tar)
        if: runner.os != 'Windows'
        run: |
          mkdir verify-bin
          tar -xzf "verify-dl/mongorescue_${VERSION}_${GOOS}_${GOARCH}.${EXT}" -C verify-bin

      - name: Unpack (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "verify-dl/mongorescue_${env:VERSION}_${env:GOOS}_${env:GOARCH}.${env:EXT}" -DestinationPath verify-bin

      - name: Smoke test the binary
        run: |
          set -euo pipefail
          bin=./verify-bin/mongorescue
          if [ "$GOOS" = windows ]; then bin=./verify-bin/mongorescue.exe; fi
          ./scripts/release-verify.sh archive "$bin" "$VERSION"

  # The linux/amd64 binary and the sha-<commit> image of this tag each do one backup
  # and one safe-clone restore, through the REST API, against MongoDB and MinIO. The
  # image is tested by digest, the one the promotion job will tag.
  verify-roundtrip:
    name: Verify backup and restore (binary and image)
    needs: [goreleaser, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # download the assets of the draft release
      packages: read # pull the image
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.goreleaser.outputs.version }}
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MongoDB Database Tools
        run: ./scripts/release-verify.sh install-tools

      - name: Download the linux/amd64 archive and check its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="mongorescue_${VERSION}_linux_amd64.tar.gz"
          mkdir verify-dl verify-bin
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-dl -p "$asset" -p checksums.txt
          (cd verify-dl && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          tar -xzf "verify-dl/$asset" -C verify-bin mongorescue

      - name: Backup and restore with the linux/amd64 binary
        run: ./scripts/release-verify.sh roundtrip binary ./verify-bin/mongorescue "$VERSION"

      - name: Backup and restore with the container image (sha-<commit>, by digest)
        run: ./scripts/release-verify.sh roundtrip image "${IMAGE}@${DIGEST}" "$VERSION"

  # The upgrade test with the real previous releases: the last two stable releases
  # create their state (secrets, a job, backups, a PITR stream) and this release's
  # binary opens the same data directory; see docs/testing.md#release-verification.
  # A release that cannot read what the last ones wrote stays a draft.
  verify-upgrade:
    name: Verify the upgrade from the previous releases
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # download the assets of the draft release (the previous ones are public)
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.goreleaser.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install MongoDB Database Tools
        run: ./scripts/release-verify.sh install-tools

      - name: Download the linux/amd64 archive and check its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="mongorescue_${VERSION}_linux_amd64.tar.gz"
          mkdir verify-dl verify-bin
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-dl -p "$asset" -p checksums.txt
          (cd verify-dl && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          tar -xzf "verify-dl/$asset" -C verify-bin mongorescue

      - name: Upgrade from the last two stable releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release-verify.sh upgrade ./verify-bin/mongorescue "$VERSION"

  # The deb and rpm packages of the draft release, installed the way users do it:
  # the .deb on Ubuntu (apt, with a running systemd: the packaged service is started
  # as the mongorescue user under the hardened unit and must answer health and serve
  # the dashboard, then the package is removed with its data kept) and the .rpm in a
  # Fedora container (dnf), each on amd64 and arm64, with --version, the service user,
  # /var/lib/mongorescue, the 0600 /etc/default/mongorescue, the Recommends of the
  # Database Tools and systemd-analyze verify of the unit (scripts/release-verify.sh
  # deb and rpm). Packages are checked against checksums.txt first.
  verify-packages:
    name: Verify deb and rpm (${{ matrix.arch }})
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write # download the assets of the draft release
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.goreleaser.outputs.version }}
      ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download the packages and check their checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir verify-dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-dl \
            -p "mongorescue_${VERSION}_linux_${ARCH}.deb" -p "mongorescue_${VERSION}_linux_${ARCH}.rpm" -p checksums.txt
          cd verify-dl
          grep -E " mongorescue_${VERSION}_linux_${ARCH}\.(deb|rpm)\$" checksums.txt > check.txt
          [ "$(wc -l < check.txt)" -eq 2 ]
          sha256sum -c check.txt

      - name: Install the .deb and run the service (Ubuntu, systemd)
        run: ./scripts/release-verify.sh deb "verify-dl/mongorescue_${VERSION}_linux_${ARCH}.deb" "$VERSION"

      - name: Install the .rpm (Fedora container)
        run: ./scripts/release-verify.sh rpm "verify-dl/mongorescue_${VERSION}_linux_${ARCH}.rpm" "$VERSION"

  # The generated Scoop, winget and Homebrew manifests of the draft release: valid
  # JSON and Ruby, the version, and the SHA-256 and URL of every archive they name,
  # checked against the archives downloaded from the release (the URLs point at the
  # release that is still a draft, so the hashes are checked locally).
  verify-manifests:
    name: Verify the Scoop, winget and Homebrew manifests
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # download the assets of the draft release
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.goreleaser.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archives and manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir verify-dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-dl \
            -p "mongorescue_${VERSION}_*.tar.gz" -p "mongorescue_${VERSION}_*.zip" \
            -p mongorescue.scoop.json -p mongorescue.cask.rb -p 'YigitCittan.MongoRescue*.yaml' -p checksums.txt
          (cd verify-dl && grep -E ' mongorescue_.*\.(tar\.gz|zip)$' checksums.txt | sha256sum -c -)

      - name: Check the manifests
        run: ./scripts/release-verify.sh manifests verify-dl "$VERSION"

  # SLSA Build Level 3 provenance of the archives and checksums.txt, generated and
  # signed in the isolated reusable workflow of slsa-github-generator, so the build
  # job cannot forge it (verify with slsa-verifier; docs/security.md). It sits next
  # to the GitHub artifact attestations above, which stay. The generator must be
  # referenced by its release tag, not a SHA: it verifies its own ref. Its upload to
  # the release is off because it cannot find the draft release; provenance-upload
  # attaches the file instead.
  provenance:
    name: SLSA Provenance
    needs: goreleaser
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      contents: write # declared by the generator's own (unused) upload job
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      provenance-name: mongorescue_${{ needs.goreleaser.outputs.version }}.intoto.jsonl
      upload-assets: false

  provenance-upload:
    name: Upload SLSA Provenance
    needs: [goreleaser, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the provenance to the draft release
    env:
      TAG: ${{ github.ref_name }}
      PROVENANCE: ${{ needs.provenance.outputs.provenance-name }}
    steps:
      # The artifact is downloaded by name, which another job of this run could
      # also have used. slsa-github-generator v2.1.0 offers no hash-checked
      # download to callers: its generic workflow outputs only the provenance
      # name (provenance-sha256 stays internal to it), and secure-download-artifact
      # is an internal action under .github/actions that needs that hash. The file
      # is therefore checked by content before it is attached: slsa-verifier
      # checks its signature (the generator's workflow identity, Rekor), this
      # repository and tag, and that it covers every archive and checksums.txt
      # of the release. A substituted file fails here.
      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false # clean release build, as in the goreleaser job

      # Pinned by version; the Go checksum database verifies the module.
      - name: Install slsa-verifier
        run: go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1

      - name: Verify the provenance against the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            -p 'mongorescue_*.tar.gz' -p 'mongorescue_*.zip' -p checksums.txt
          for f in release-assets/*; do
            slsa-verifier verify-artifact "$f" --provenance-path "$PROVENANCE" \
              --source-uri "github.com/$GITHUB_REPOSITORY" --source-tag "$TAG"
          done

      - name: Upload the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$PROVENANCE" --clobber --repo "$GITHUB_REPOSITORY"

  # Desktop app (Wails v2, CGO): built natively on each OS after GoReleaser created
  # the (draft) release, then uploaded to it. The plain server binaries above stay
  # for headless API/MCP use. gh finds a draft release by its tag name.
  desktop:
    name: Desktop App (${{ matrix.name }})
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload assets to the release
      id-token: write # keyless signing of the provenance attestation
      attestations: write # store the attestation
      actions: read # SignPath reads the job details and downloads the unsigned workflow artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: windows/amd64
            tags: desktop
          - name: macos
            os: macos-latest
            platform: darwin/universal
            tags: desktop
          - name: linux
            os: ubuntu-latest
            platform: linux/amd64
            # Ubuntu 24.04 ships WebKitGTK 4.1 only.
            tags: desktop,webkit2_41
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      WAILS_VERSION: v2.16.0 # keep in sync with github.com/wailsapp/wails/v2 in go.mod
      # Windows code signing through SignPath (docs/desktop.md, "Code signing"). Off
      # until the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable
      # exist; while off, every signing step is skipped and the Windows build is the
      # unsigned `wails build -nsis` output, as before.
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      # MongoDB Database Tools (Apache-2.0) bundled with the desktop app, so users do
      # not have to install mongodump and mongorestore. Keep the version in sync with
      # MONGO_TOOLS_VERSION in ci.yml; the SHA-256 of each archive changes with it
      # (curl -fsSL -O <url> && sha256sum <file>).
      MONGO_TOOLS_VERSION: '100.12.2'
      MONGO_TOOLS_SHA256_WINDOWS_X86_64: 7f53efa9ef65b466c354219a2d29ea6cc8d2861833356851253f03bf96f8bf6f
      MONGO_TOOLS_SHA256_MACOS_ARM64: 40189a68db848bd152e040b4f19af59ff1787ab7850773d5a080c403d6edf9e7
      MONGO_TOOLS_SHA256_MACOS_X86_64: b7546c4fb22de2786c44d9fec6a4d52df7dcaf6bdf236beb7ed9172f068e50e1
      MONGO_TOOLS_SHA256_UBUNTU2204_X86_64: 944fbc6ed2a383ea5cb5acb77ca67d4b4415875c63f15f6b61650a0d5fe903d2
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false # clean release build, as in the goreleaser job

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          command -v makensis || choco install nsis --version 3.13.0 --require-checksums -y --no-progress
          # choco does not put NSIS on PATH for later steps.
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      # Stages mongodump, mongorestore and MongoDB's license files in build/bin/tools,
      # where the resolver (internal/mongotools) finds them next to the executable.
      # Each archive is checked against its pinned SHA-256 before it is unpacked.
      # The binaries are used as MongoDB ships them: the Windows ones are signed by
      # MongoDB, and on macOS lipo keeps each slice's MongoDB signature. This runs
      # before the build, since `wails build -nsis` packs build/bin/tools into the
      # installer.
      - name: Stage MongoDB Database Tools
        working-directory: cmd/mongorescue-desktop
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/mongo-tools"
          tools=build/bin/tools
          mkdir -p "$dl"
          rm -rf "$tools"
          mkdir -p "$tools"
          # fetch <platform> <ext> <sha256>: downloads, verifies and unpacks one
          # archive into $dl and sets $unpacked to the directory it unpacked to. It
          # is not called in $(...), where bash ignores set -e.
          fetch() {
            local name="mongodb-database-tools-$1-${MONGO_TOOLS_VERSION}"
            local file="$dl/$name.$2"
            curl -fsSL --retry 3 -o "$file" "https://fastdl.mongodb.org/tools/db/$name.$2"
            local sum=(shasum -a 256)
            if command -v sha256sum >/dev/null; then sum=(sha256sum); fi
            (cd "$dl" && echo "$3  $name.$2" | "${sum[@]}" -c -)
            case "$2" in
              zip) if [ "$RUNNER_OS" = "Windows" ]; then 7z x -y -bso0 -o"$dl" "$file"; else unzip -q -o "$file" -d "$dl"; fi ;;
              tgz) tar -xzf "$file" -C "$dl" ;;
            esac
            unpacked="$dl/$name"
          }
          ext=""
          case "$RUNNER_OS" in
            Windows)
              fetch windows-x86_64 zip "$MONGO_TOOLS_SHA256_WINDOWS_X86_64"
              src="$unpacked"
              ext=.exe
              cp "$src/bin/mongodump.exe" "$src/bin/mongorestore.exe" "$tools/" ;;
            macOS)
              fetch macos-arm64 zip "$MONGO_TOOLS_SHA256_MACOS_ARM64"
              src="$unpacked"
              fetch macos-x86_64 zip "$MONGO_TOOLS_SHA256_MACOS_X86_64"
              x86="$unpacked"
              for t in mongodump mongorestore; do
                lipo -create -output "$tools/$t" "$src/bin/$t" "$x86/bin/$t"
                lipo "$tools/$t" -verify_arch arm64 x86_64
                codesign --verify --strict "$tools/$t"
              done ;;
            Linux)
              # Needs glibc 2.34+ (Ubuntu 22.04+), below what the app itself needs.
              fetch ubuntu2204-x86_64 tgz "$MONGO_TOOLS_SHA256_UBUNTU2204_X86_64"
              src="$unpacked"
              cp "$src/bin/mongodump" "$src/bin/mongorestore" "$tools/" ;;
          esac
          cp "$src/LICENSE.md" "$src/THIRD-PARTY-NOTICES" "$tools/"
          if [ "$RUNNER_OS" != "Windows" ]; then chmod 0755 "$tools/mongodump" "$tools/mongorestore"; fi
          "$tools/mongodump$ext" --version
          "$tools/mongorestore$ext" --version
          ls -l "$tools"

      - name: Build desktop app
        working-directory: cmd/mongorescue-desktop
        env:
          CGO_ENABLED: '1'
          PLATFORM: ${{ matrix.platform }}
          TAGS: ${{ matrix.tags }}
        run: |
          # Stamp the release version into the installer and app metadata.
          jq --arg v "${TAG#v}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json
          nsis=()
          if [ "$RUNNER_OS" = "Windows" ]; then nsis=(-nsis); fi
          # No -clean: it would delete build/bin, and with it the staged tools; the
          # checkout is fresh anyway.
          wails build -trimpath -s -skipbindings -m -nosyncgomod \
            -platform "$PLATFORM" -tags "$TAGS" \
            -ldflags "-X main.Version=${TAG#v} -X main.Commit=${GITHUB_SHA::7}" "${nsis[@]}"
          # wails only warns when makensis is missing; fail instead.
          if [ "$RUNNER_OS" = "Windows" ] && [ ! -f build/bin/MongoRescue-amd64-installer.exe ]; then
            echo "::error::NSIS installer was not produced"; exit 1
          fi

      # The bundle is not codesigned as a whole today; if it ever is (a
      # Contents/_CodeSignature seal), it is re-signed ad hoc after adding the tools,
      # without --deep so that the tools keep MongoDB's signatures.
      - name: Add the MongoDB Database Tools to the app bundle
        if: runner.os == 'macOS'
        working-directory: cmd/mongorescue-desktop/build/bin
        run: |
          set -euo pipefail
          res=MongoRescue.app/Contents/Resources
          mkdir -p "$res"
          rm -rf "$res/tools"
          mv tools "$res/tools"
          if [ -d MongoRescue.app/Contents/_CodeSignature ]; then
            codesign --force --sign - MongoRescue.app
            codesign --verify --strict MongoRescue.app
          fi
          codesign --verify --strict "$res/tools/mongodump" "$res/tools/mongorestore"
          "$res/tools/mongodump" --version
          ls -l "$res/tools"

      # Windows signing (only when SIGNING_ENABLED): sign MongoRescue.exe, rebuild
      # the installer around the signed exe, then sign the installer. Each SignPath
      # request carries a single PE file. The signed files replace the unsigned ones
      # in build/bin, so the packaging, attestation and checksum steps below are the
      # same with and without signing. The uninstaller inside the installer stays
      # unsigned (see docs/desktop.md).
      - name: Upload the unsigned exe for signing
        id: upload-exe
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe-unsigned
          path: cmd/mongorescue-desktop/build/bin/MongoRescue.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the exe (SignPath)
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mongorescue' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Leaves time for a manual approval of the signing request.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/signpath-out/exe

      # Same makensis call as `wails build -nsis` (pkg/commands/build/nsis_installer.go
      # in Wails v2.16.0): run in build/windows/installer with ARG_WAILS_AMD64_BINARY,
      # reusing the wails_tools.nsh and WebView2 bootstrapper the build step wrote and
      # the tools staged in build/bin/tools.
      - name: Rebuild the installer around the signed exe
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        working-directory: cmd/mongorescue-desktop/build
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/signpath-out/exe/MongoRescue.exe" bin/MongoRescue.exe
          rm -f bin/MongoRescue-amd64-installer.exe
          cd windows/installer
          makensis '-DARG_WAILS_AMD64_BINARY=..\..\bin\MongoRescue.exe' project.nsi
          if [ ! -f ../../bin/MongoRescue-amd64-installer.exe ]; then
            echo "::error::NSIS installer was not produced"; exit 1
          fi

      - name: Upload the unsigned installer for signing
        id: upload-installer
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-unsigned
          path: cmd/mongorescue-desktop/build/bin/MongoRescue-amd64-installer.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath)
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mongorescue' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/signpath-out/installer

      - name: Use the signed installer
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        working-directory: cmd/mongorescue-desktop/build/bin
        run: cp "$GITHUB_WORKSPACE/signpath-out/installer/MongoRescue-amd64-installer.exe" MongoRescue-amd64-installer.exe

      - name: Verify the Authenticode signatures
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        working-directory: cmd/mongorescue-desktop/build/bin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in 'MongoRescue.exe', 'MongoRescue-amd64-installer.exe') {
            $sig = Get-AuthenticodeSignature -FilePath $file
            Write-Output "${file}: $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Output "::error::$file is not validly signed ($($sig.Status))"
              exit 1
            }
          }

      - name: Package artifacts
        working-directory: cmd/mongorescue-desktop/build/bin
        run: |
          mkdir -p "$GITHUB_WORKSPACE/desktop-dist"
          out="$GITHUB_WORKSPACE/desktop-dist/MongoRescue-desktop_${TAG#v}"
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              # project.nsi skips the tools with only a warning when they are missing.
              if ! 7z l MongoRescue-amd64-installer.exe | grep -qF mongorestore.exe; then
                echo "::error::the installer does not contain the MongoDB Database Tools"; exit 1
              fi
              cp MongoRescue-amd64-installer.exe "${out}_windows_amd64_installer.exe"
              7z a "${out}_windows_amd64_portable.zip" MongoRescue.exe tools ;;
            macOS)
              ditto -c -k --keepParent MongoRescue.app "${out}_macos_universal.zip" ;;
            Linux)
              tar -czf "${out}_linux_amd64.tar.gz" MongoRescue tools ;;
          esac
          ls -l "$GITHUB_WORKSPACE/desktop-dist"

      - name: Attest Desktop Artifact Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop-dist/*

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless Sigstore signature of each desktop asset, as for the server
      # archives: <asset>.sigstore.json, uploaded next to it. The desktop updater
      # ignores the bundles (it picks assets by exact name).
      - name: Sign desktop artifacts (cosign)
        run: |
          set -euo pipefail
          for f in desktop-dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" desktop-dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # CONTRACT (the desktop updater depends on it): once every desktop build is
  # attached, MongoRescue-desktop_<version>_checksums.txt lists one
  # "<sha256>  <file>" line (sha256sum format) per desktop asset of the release,
  # itself and the cosign bundles (*.sigstore.json) excluded. The asset names must
  # stay:
  #   MongoRescue-desktop_<version>_windows_amd64_installer.exe
  #   MongoRescue-desktop_<version>_windows_amd64_portable.zip
  #   MongoRescue-desktop_<version>_macos_universal.zip
  #   MongoRescue-desktop_<version>_linux_amd64.tar.gz
  desktop-checksums:
    name: Desktop App checksums
    # Publishing waits for the SLSA provenance too, so a published release always
    # carries it, and for the release verification (archives on every OS and
    # architecture, backup and restore of the binary and the image, the upgrade from
    # the previous releases, the deb and rpm packages and the package manager
    # manifests): a failure there leaves the release a draft and the image without
    # version tags.
    needs: [desktop, provenance-upload, image, verify-archives, verify-roundtrip, verify-upgrade, verify-packages, verify-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write # download and upload release assets
      id-token: write # keyless cosign signature of the desktop checksums
      packages: write # promote the image tags in GHCR
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Write, sign and upload the desktop checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prefix="MongoRescue-desktop_${version}_"
          sums="${prefix}checksums.txt"
          mkdir desktop-dist
          cd desktop-dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'MongoRescue-desktop_*'
          for suffix in windows_amd64_installer.exe windows_amd64_portable.zip macos_universal.zip linux_amd64.tar.gz; do
            if [ ! -f "${prefix}${suffix}" ]; then
              echo "::error::release $TAG lacks ${prefix}${suffix}"; exit 1
            fi
          done
          # Every desktop asset of this version except the checksum file itself and
          # the signature bundles.
          files=()
          for f in "${prefix}"*; do
            case "$f" in
              "$sums" | *.sigstore.json) ;;
              *) files+=("$f") ;;
            esac
          done
          sha256sum -- "${files[@]}" > "$sums"
          cat "$sums"
          cosign sign-blob --yes --bundle "$sums.sigstore.json" "$sums"
          gh release upload "$TAG" "$sums" "$sums.sigstore.json" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything above succeeded: give the image built for this tag (digest from
      # the image job) its release tags. This is a manifest-only copy of the same
      # index, so the digest, and with it the cosign signature, the attestation and
      # the BuildKit provenance, stay valid. Pre-releases get only their exact
      # version, never <major>.<minor> or latest, as for the GitHub release below.
      - name: Promote the image (version tags and latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          tags=("$version")
          if [ "$prerelease" != "true" ]; then
            tags+=("${version%.*}" latest)
          fi
          args=()
          for t in "${tags[@]}"; do args+=(--tag "${IMAGE}:${t}"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for t in "${tags[@]}"; do
            got="$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{.Manifest.Digest}}')"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${IMAGE}:${t} is ${got}, expected ${DIGEST}"; exit 1
            fi
          done

      # GoReleaser creates the release as a draft; it is published only now, with
      # every desktop asset and the checksums attached and the image promoted, so the
      # desktop updater (which reads releases/latest) never sees a release it cannot
      # install, and the image of the release exists when it becomes visible.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          latest=()
          if [ "$prerelease" != "true" ]; then latest=(--latest); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${latest[@]}"

  # The Helm chart as a signed OCI artifact: oci://ghcr.io/<owner>/charts/mongorescue.
  # It runs after desktop-checksums, which promoted the image (the chart's appVersion
  # tag, its default image.tag, must exist) and published the release. The chart
  # version is the one in Chart.yaml (its own lifecycle, docs/versioning.md); appVersion
  # is the tag. A chart version that is already in the registry is never overwritten:
  # releases without a chart change keep the chart they have, and image.tag selects
  # the newer image.
  helm-chart:
    name: Helm chart (OCI)
    needs: [desktop-checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the chart to GHCR
      id-token: write # keyless cosign signature of the chart digest
    env:
      TAG: ${{ github.ref_name }}
      # Same pinned helm as helm.yml.
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      # The helm binary inside that archive, and the same release as an image
      # (fallback when get.helm.sh fails; scripts/install-helm.sh checks both).
      HELM_BIN_SHA256: 57ce7fc4ea77b28ee6fa91ae071abcade74d3f524e80c9decff5877a5ac8eda4
      HELM_IMAGE: docker.io/alpine/helm:4.3.0@sha256:377d0fc44fb5513cc6efd7b04e5a44d732fa82df2389aa03097f1aa0e103a731
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install helm
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/scripts/install-helm.sh" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GitHub Container Registry (GHCR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Package, push and sign the chart
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="oci://ghcr.io/${owner}/charts"
          app="${TAG#v}"
          mkdir chart-dist
          helm lint --strict deploy/helm/mongorescue --set-string image.tag="$app"
          # --app-version sets appVersion to the tag; version stays Chart.yaml's.
          helm package deploy/helm/mongorescue --app-version "$app" --destination chart-dist
          pkg="$(ls chart-dist/mongorescue-*.tgz)"
          version="$(helm show chart "$pkg" | sed -n 's/^version: //p')"
          echo "chart ${version}, appVersion ${app}"
          if helm show chart "${repo}/mongorescue" --version "$version" >/dev/null 2>&1; then
            echo "::notice::chart ${version} is already in ${repo}; not overwritten (bump Chart.yaml version to publish chart changes)"
            exit 0
          fi
          helm push "$pkg" "$repo" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          case "$digest" in sha256:*) ;; *) echo "::error::no digest in the helm push output"; exit 1 ;; esac
          ref="${repo#oci://}/mongorescue"
          cosign sign --yes "${ref}@${digest}"
          cosign verify "${ref}@${digest}"             --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"             --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "Chart ${version} pushed as ${ref}@${digest}" >> "$GITHUB_STEP_SUMMARY"

  # Pushes the Scoop manifest and the Homebrew cask of the published release to the
  # bucket and tap repositories, after the release is public, so a manifest never
  # points at a draft or at a release that failed verification. Skipped, with a
  # notice, when the PACKAGES_TOKEN secret is not set (a fine-grained token with
  # contents: write on the tap and bucket) and for pre-releases. The winget manifests
  # stay release assets: the first submission to microsoft/winget-pkgs is manual
  # (CONTRIBUTING.md, "To cut a release"). A failure here does not unpublish the
  # release; re-run the job.
  packages:
    name: Package managers (Scoop bucket, Homebrew tap)
    needs: [goreleaser, desktop-checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # download the manifests of the published release
    env:
      TAG: ${{ github.ref_name }}
      OWNER: ${{ github.repository_owner }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - name: Push the manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "::notice::PACKAGES_TOKEN is not set: the Scoop and Homebrew manifests stay release assets"
            exit 0
          fi
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" = "true" ]; then
            echo "::notice::$TAG is a pre-release: the package manager repositories are not updated"
            exit 0
          fi
          echo "::add-mask::$PACKAGES_TOKEN"
          mkdir manifests
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir manifests -p mongorescue.scoop.json -p mongorescue.cask.rb
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PACKAGES_TOKEN" | base64 -w0)"
          push() { # push REPO FILE DESTINATION
            local repo=$1 src=$2 dst=$3
            git -c "http.extraheader=$auth" clone --depth 1 "https://github.com/${OWNER}/${repo}.git" "clone-${repo}"
            mkdir -p "clone-${repo}/$(dirname "$dst")"
            cp "manifests/$src" "clone-${repo}/$dst"
            cd "clone-${repo}"
            git add "$dst"
            if git diff --cached --quiet; then
              echo "${repo} is already up to date"
            else
              git -c user.name=mongorescue-release -c user.email=noreply@github.com commit -m "mongorescue ${TAG}"
              git -c "http.extraheader=$auth" push origin HEAD
            fi
            cd ..
          }
          push scoop-bucket mongorescue.scoop.json bucket/mongorescue.json
          push homebrew-tap mongorescue.cask.rb Casks/mongorescue.rb
