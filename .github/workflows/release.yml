name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a release that is already publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # keyless signing of the provenance attestation
      attestations: write # store the attestation
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Keep in sync with GO_VERSION in ci.yml and the Dockerfile builder.
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Install Syft (SBOM generator used by GoReleaser)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # The release body is the CHANGELOG.md section of the tagged version; a
      # missing or empty section fails the release.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/changelog-section.sh "$TAG" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Release Artifact Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Desktop app (Wails v2, CGO): built natively on each OS after GoReleaser created
  # the (draft) release, then uploaded to it. The plain server binaries above stay
  # for headless API/MCP use. gh finds a draft release by its tag name.
  desktop:
    name: Desktop App (${{ matrix.name }})
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload assets to the release
      id-token: write # keyless signing of the provenance attestation
      attestations: write # store the attestation
      actions: read # SignPath reads the job details and downloads the unsigned workflow artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: windows/amd64
            tags: desktop
          - name: macos
            os: macos-latest
            platform: darwin/universal
            tags: desktop
          - name: linux
            os: ubuntu-latest
            platform: linux/amd64
            # Ubuntu 24.04 ships WebKitGTK 4.1 only.
            tags: desktop,webkit2_41
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      WAILS_VERSION: v2.16.0 # keep in sync with github.com/wailsapp/wails/v2 in go.mod
      # Windows code signing through SignPath (docs/desktop.md, "Code signing"). Off
      # until the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable
      # exist; while off, every signing step is skipped and the Windows build is the
      # unsigned `wails build -nsis` output, as before.
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      # MongoDB Database Tools (Apache-2.0) bundled with the desktop app, so users do
      # not have to install mongodump and mongorestore. Keep the version in sync with
      # MONGO_TOOLS_VERSION in ci.yml; the SHA-256 of each archive changes with it
      # (curl -fsSL -O <url> && sha256sum <file>).
      MONGO_TOOLS_VERSION: '100.12.2'
      MONGO_TOOLS_SHA256_WINDOWS_X86_64: 7f53efa9ef65b466c354219a2d29ea6cc8d2861833356851253f03bf96f8bf6f
      MONGO_TOOLS_SHA256_MACOS_ARM64: 40189a68db848bd152e040b4f19af59ff1787ab7850773d5a080c403d6edf9e7
      MONGO_TOOLS_SHA256_MACOS_X86_64: b7546c4fb22de2786c44d9fec6a4d52df7dcaf6bdf236beb7ed9172f068e50e1
      MONGO_TOOLS_SHA256_UBUNTU2204_X86_64: 944fbc6ed2a383ea5cb5acb77ca67d4b4415875c63f15f6b61650a0d5fe903d2
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          command -v makensis || choco install nsis --version 3.13.0 --require-checksums -y --no-progress
          # choco does not put NSIS on PATH for later steps.
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      # Stages mongodump, mongorestore and MongoDB's license files in build/bin/tools,
      # where the resolver (internal/mongotools) finds them next to the executable.
      # Each archive is checked against its pinned SHA-256 before it is unpacked.
      # The binaries are used as MongoDB ships them: the Windows ones are signed by
      # MongoDB, and on macOS lipo keeps each slice's MongoDB signature. This runs
      # before the build, since `wails build -nsis` packs build/bin/tools into the
      # installer.
      - name: Stage MongoDB Database Tools
        working-directory: cmd/mongorescue-desktop
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/mongo-tools"
          tools=build/bin/tools
          mkdir -p "$dl"
          rm -rf "$tools"
          mkdir -p "$tools"
          # fetch <platform> <ext> <sha256>: downloads, verifies and unpacks one
          # archive into $dl and sets $unpacked to the directory it unpacked to. It
          # is not called in $(...), where bash ignores set -e.
          fetch() {
            local name="mongodb-database-tools-$1-${MONGO_TOOLS_VERSION}"
            local file="$dl/$name.$2"
            curl -fsSL --retry 3 -o "$file" "https://fastdl.mongodb.org/tools/db/$name.$2"
            local sum=(shasum -a 256)
            if command -v sha256sum >/dev/null; then sum=(sha256sum); fi
            (cd "$dl" && echo "$3  $name.$2" | "${sum[@]}" -c -)
            case "$2" in
              zip) if [ "$RUNNER_OS" = "Windows" ]; then 7z x -y -bso0 -o"$dl" "$file"; else unzip -q -o "$file" -d "$dl"; fi ;;
              tgz) tar -xzf "$file" -C "$dl" ;;
            esac
            unpacked="$dl/$name"
          }
          ext=""
          case "$RUNNER_OS" in
            Windows)
              fetch windows-x86_64 zip "$MONGO_TOOLS_SHA256_WINDOWS_X86_64"
              src="$unpacked"
              ext=.exe
              cp "$src/bin/mongodump.exe" "$src/bin/mongorestore.exe" "$tools/" ;;
            macOS)
              fetch macos-arm64 zip "$MONGO_TOOLS_SHA256_MACOS_ARM64"
              src="$unpacked"
              fetch macos-x86_64 zip "$MONGO_TOOLS_SHA256_MACOS_X86_64"
              x86="$unpacked"
              for t in mongodump mongorestore; do
                lipo -create -output "$tools/$t" "$src/bin/$t" "$x86/bin/$t"
                lipo "$tools/$t" -verify_arch arm64 x86_64
                codesign --verify --strict "$tools/$t"
              done ;;
            Linux)
              # Needs glibc 2.34+ (Ubuntu 22.04+), below what the app itself needs.
              fetch ubuntu2204-x86_64 tgz "$MONGO_TOOLS_SHA256_UBUNTU2204_X86_64"
              src="$unpacked"
              cp "$src/bin/mongodump" "$src/bin/mongorestore" "$tools/" ;;
          esac
          cp "$src/LICENSE.md" "$src/THIRD-PARTY-NOTICES" "$tools/"
          if [ "$RUNNER_OS" != "Windows" ]; then chmod 0755 "$tools/mongodump" "$tools/mongorestore"; fi
          "$tools/mongodump$ext" --version
          "$tools/mongorestore$ext" --version
          ls -l "$tools"

      - name: Build desktop app
        working-directory: cmd/mongorescue-desktop
        env:
          CGO_ENABLED: '1'
          PLATFORM: ${{ matrix.platform }}
          TAGS: ${{ matrix.tags }}
        run: |
          # Stamp the release version into the installer and app metadata.
          jq --arg v "${TAG#v}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json
          nsis=()
          if [ "$RUNNER_OS" = "Windows" ]; then nsis=(-nsis); fi
          # No -clean: it would delete build/bin, and with it the staged tools; the
          # checkout is fresh anyway.
          wails build -trimpath -s -skipbindings -m -nosyncgomod \
            -platform "$PLATFORM" -tags "$TAGS" \
            -ldflags "-X main.Version=${TAG#v} -X main.Commit=${GITHUB_SHA::7}" "${nsis[@]}"
          # wails only warns when makensis is missing; fail instead.
          if [ "$RUNNER_OS" = "Windows" ] && [ ! -f build/bin/MongoRescue-amd64-installer.exe ]; then
            echo "::error::NSIS installer was not produced"; exit 1
          fi

      # The bundle is not codesigned as a whole today; if it ever is (a
      # Contents/_CodeSignature seal), it is re-signed ad hoc after adding the tools,
      # without --deep so that the tools keep MongoDB's signatures.
      - name: Add the MongoDB Database Tools to the app bundle
        if: runner.os == 'macOS'
        working-directory: cmd/mongorescue-desktop/build/bin
        run: |
          set -euo pipefail
          res=MongoRescue.app/Contents/Resources
          mkdir -p "$res"
          rm -rf "$res/tools"
          mv tools "$res/tools"
          if [ -d MongoRescue.app/Contents/_CodeSignature ]; then
            codesign --force --sign - MongoRescue.app
            codesign --verify --strict MongoRescue.app
          fi
          codesign --verify --strict "$res/tools/mongodump" "$res/tools/mongorestore"
          "$res/tools/mongodump" --version
          ls -l "$res/tools"

      # Windows signing (only when SIGNING_ENABLED): sign MongoRescue.exe, rebuild
      # the installer around the signed exe, then sign the installer. Each SignPath
      # request carries a single PE file. The signed files replace the unsigned ones
      # in build/bin, so the packaging, attestation and checksum steps below are the
      # same with and without signing. The uninstaller inside the installer stays
      # unsigned (see docs/desktop.md).
      - name: Upload the unsigned exe for signing
        id: upload-exe
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe-unsigned
          path: cmd/mongorescue-desktop/build/bin/MongoRescue.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the exe (SignPath)
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mongorescue' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Leaves time for a manual approval of the signing request.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/signpath-out/exe

      # Same makensis call as `wails build -nsis` (pkg/commands/build/nsis_installer.go
      # in Wails v2.16.0): run in build/windows/installer with ARG_WAILS_AMD64_BINARY,
      # reusing the wails_tools.nsh and WebView2 bootstrapper the build step wrote and
      # the tools staged in build/bin/tools.
      - name: Rebuild the installer around the signed exe
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        working-directory: cmd/mongorescue-desktop/build
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/signpath-out/exe/MongoRescue.exe" bin/MongoRescue.exe
          rm -f bin/MongoRescue-amd64-installer.exe
          cd windows/installer
          makensis '-DARG_WAILS_AMD64_BINARY=..\..\bin\MongoRescue.exe' project.nsi
          if [ ! -f ../../bin/MongoRescue-amd64-installer.exe ]; then
            echo "::error::NSIS installer was not produced"; exit 1
          fi

      - name: Upload the unsigned installer for signing
        id: upload-installer
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-unsigned
          path: cmd/mongorescue-desktop/build/bin/MongoRescue-amd64-installer.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath)
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mongorescue' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/signpath-out/installer

      - name: Use the signed installer
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        working-directory: cmd/mongorescue-desktop/build/bin
        run: cp "$GITHUB_WORKSPACE/signpath-out/installer/MongoRescue-amd64-installer.exe" MongoRescue-amd64-installer.exe

      - name: Verify the Authenticode signatures
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        working-directory: cmd/mongorescue-desktop/build/bin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in 'MongoRescue.exe', 'MongoRescue-amd64-installer.exe') {
            $sig = Get-AuthenticodeSignature -FilePath $file
            Write-Output "${file}: $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Output "::error::$file is not validly signed ($($sig.Status))"
              exit 1
            }
          }

      - name: Package artifacts
        working-directory: cmd/mongorescue-desktop/build/bin
        run: |
          mkdir -p "$GITHUB_WORKSPACE/desktop-dist"
          out="$GITHUB_WORKSPACE/desktop-dist/MongoRescue-desktop_${TAG#v}"
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              # project.nsi skips the tools with only a warning when they are missing.
              if ! 7z l MongoRescue-amd64-installer.exe | grep -qF mongorestore.exe; then
                echo "::error::the installer does not contain the MongoDB Database Tools"; exit 1
              fi
              cp MongoRescue-amd64-installer.exe "${out}_windows_amd64_installer.exe"
              7z a "${out}_windows_amd64_portable.zip" MongoRescue.exe tools ;;
            macOS)
              ditto -c -k --keepParent MongoRescue.app "${out}_macos_universal.zip" ;;
            Linux)
              tar -czf "${out}_linux_amd64.tar.gz" MongoRescue tools ;;
          esac
          ls -l "$GITHUB_WORKSPACE/desktop-dist"

      - name: Attest Desktop Artifact Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop-dist/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" desktop-dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # CONTRACT (the desktop updater depends on it): once every desktop build is
  # attached, MongoRescue-desktop_<version>_checksums.txt lists one
  # "<sha256>  <file>" line (sha256sum format) per desktop asset of the release,
  # itself excluded. The asset names must stay:
  #   MongoRescue-desktop_<version>_windows_amd64_installer.exe
  #   MongoRescue-desktop_<version>_windows_amd64_portable.zip
  #   MongoRescue-desktop_<version>_macos_universal.zip
  #   MongoRescue-desktop_<version>_linux_amd64.tar.gz
  desktop-checksums:
    name: Desktop App checksums
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write # download and upload release assets
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Write and upload the desktop checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prefix="MongoRescue-desktop_${version}_"
          sums="${prefix}checksums.txt"
          mkdir desktop-dist
          cd desktop-dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'MongoRescue-desktop_*'
          for suffix in windows_amd64_installer.exe windows_amd64_portable.zip macos_universal.zip linux_amd64.tar.gz; do
            if [ ! -f "${prefix}${suffix}" ]; then
              echo "::error::release $TAG lacks ${prefix}${suffix}"; exit 1
            fi
          done
          # Every desktop asset of this version except the checksum file itself.
          files=()
          for f in "${prefix}"*; do
            [ "$f" = "$sums" ] || files+=("$f")
          done
          sha256sum -- "${files[@]}" > "$sums"
          cat "$sums"
          gh release upload "$TAG" "$sums" --clobber --repo "$GITHUB_REPOSITORY"

      # GoReleaser creates the release as a draft; it is published only now, with
      # every desktop asset and the checksums attached, so the desktop updater
      # (which reads releases/latest) never sees a release it cannot install.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          latest=()
          if [ "$prerelease" != "true" ]; then latest=(--latest); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${latest[@]}"
