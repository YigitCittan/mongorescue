# gitleaks configuration: default rules plus an allowlist for the exact fake
# credentials used as unit-test fixtures. Keep this list to literal values;
# never allowlist whole files or directories.
[extend]
useDefault = true

[[allowlists]]
description = "Fake API keys used in unit tests"
regexes = [
  '''^legacy-key-0123456789$''',
  '''^notify-test-key-0123$''',
  '''^cors-test-api-key-0123$''',
]

[[allowlists]]
description = "TEST ONLY age identity of the golden restore fixtures (internal/restore/testdata/compat)"
regexes = [
  '''^AGE-SECRET-KEY-19J3DWER8ED985HNSHV8YEKTMRSRVTTTQKZ54P4GVAFMCWT2C8NKSTCJDMM$''',
]

[[allowlists]]
description = "TEST ONLY x509 client key of the browser tests (e2e/fixtures/client.key)"
regexes = [
  '''I/wqtlMrlkx3lQbv63QH7hYQP36hRANCAAS7jnaF7T8zn9hqrKLMNQ/zTU6Qcksv''',
]
