# ==============================================================================
# MongoRescue — golangci-lint Configuration (v2)
# https://golangci-lint.run/usage/configuration/
# ==============================================================================

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # The "standard" set (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - depguard
    - errorlint
    - gosec
    - misspell
    - revive
  settings:
    # The import invariants of AGENTS.md. A rule applies to the files its "files"
    # globs select ("$test" is every _test.go file, a "!" negates a glob); a
    # violation fails the lint job.
    depguard:
      rules:
        # The MongoDB Go driver only in the adapter (and tests).
        mongo-driver:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/mongoconn/**"
            - "!**/internal/oplog/**"
          deny:
            - pkg: go.mongodb.org/mongo-driver
              desc: the MongoDB driver is allowed only in internal/mongoconn and _test.go files
        # internal/oplog may use the bson codec and nothing else of the driver.
        oplog-bson-only:
          files:
            - "**/internal/oplog/**"
            - "!$test"
          list-mode: lax
          allow:
            - go.mongodb.org/mongo-driver/v2/bson
          deny:
            - pkg: go.mongodb.org/mongo-driver
              desc: internal/oplog may import only go.mongodb.org/mongo-driver/v2/bson from the driver
        # Business packages never depend on the transport layers.
        business-no-transport:
          files:
            - "**/internal/backup/**"
            - "**/internal/restore/**"
            - "**/internal/scheduler/**"
            - "**/internal/notify/**"
          deny:
            - pkg: github.com/yigitcittan/mongorescue/internal/server
              desc: business packages (backup, restore, scheduler, notify) must not depend on internal/server
            - pkg: github.com/yigitcittan/mongorescue/cmd
              desc: business packages (backup, restore, scheduler, notify) must not depend on cmd
        # The REST client is shared with the MCP bridge and never knows the server.
        apiclient-no-server:
          files:
            - "**/internal/apiclient/**"
          deny:
            - pkg: github.com/yigitcittan/mongorescue/internal/server
              desc: internal/apiclient must not import internal/server
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G204 # Subprocess launched with variable (mongodump/mongorestore is core design)
        - G304 # File path as taint input (checked by path traversal validator)
        - G702 # Taint-analysis variant of G204 (argument slices, never a shell)
        - G703 # Taint-analysis variant of G304 (keys are validated by the storage layer)
  exclusions:
    generated: lax
    # Keep the v1 default exclusions so the migration does not change the baseline.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests use fixture credentials (redaction cases) and deliberate byte wraparound.
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G115"
    paths:
      - web
      - dist
      - build

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
