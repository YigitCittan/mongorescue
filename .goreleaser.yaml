# ==============================================================================
# MongoRescue GoReleaser Specification
# https://goreleaser.com
# ==============================================================================

version: 2

project_name: mongorescue

before:
  hooks:
    - go mod tidy
    - go test -v -race ./...

builds:
  - id: mongorescue
    main: ./cmd/mongorescue
    binary: mongorescue
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{ .Version }}
      - -X main.Commit={{ .Commit }}
      - -X main.Date={{ .Date }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - scripts/mongorescue.service

# The release is created as a draft: the desktop jobs of the release workflow
# attach their builds and the desktop checksums, then publish it. Until then the
# desktop updater (releases/latest) does not see it, so it never offers a version
# whose installer is not there yet. Tags with a pre-release suffix (v1.2.0-rc.1)
# are published as pre-releases.
release:
  draft: true
  prerelease: auto

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# One SPDX JSON SBOM per archive (<archive>.sbom.json), generated with syft.
sboms:
  - id: archive-sboms
    artifacts: archive

# Local runs only: the release workflow passes the CHANGELOG.md section of the
# tag with --release-notes (scripts/changelog-section.sh), which replaces the
# generated commit list in the GitHub release.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
