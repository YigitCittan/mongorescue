{{- if .Values.grafana.dashboard.enabled }}
{{- /* files/grafana-dashboard.json is a copy of deploy/grafana/mongorescue.json (CI checks they match). It is read, not templated, so the panels keep their own {{legend}} syntax. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongorescue.fullname" . }}-grafana-dashboard
  labels:
    {{- include "mongorescue.labels" . | nindent 4 }}
    {{- with .Values.grafana.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  mongorescue.json: |-
    {{- .Files.Get "files/grafana-dashboard.json" | nindent 4 }}
{{- end }}
