{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mongorescue.fullname" . }}
  labels:
    {{- include "mongorescue.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mongorescue.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.egressTo }}
    {{- toYaml .Values.networkPolicy.egressTo | nindent 4 }}
    {{- else }}
    # Every destination: MongoDB servers, S3, notification webhooks and SSO.
    - {}
    {{- end }}
{{- end }}
