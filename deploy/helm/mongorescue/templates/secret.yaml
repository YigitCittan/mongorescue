{{- if and (not .Values.secretKey.existingSecret) .Values.secretKey.generate }}
{{- $name := include "mongorescue.secretKeySecret" . }}
{{- $key := .Values.secretKey.existingSecretKey }}
{{- /* Reuse the key of an earlier install or upgrade: a new key would not open the database. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $value = index $existing.data $key }}
{{- else }}
{{- $value = randBytes 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mongorescue.labels" . | nindent 4 }}
  annotations:
    # Losing this key makes every stored credential unrecoverable: keep the Secret
    # when the release is uninstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
{{- end }}
