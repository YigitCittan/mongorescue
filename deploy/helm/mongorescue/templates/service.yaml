apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongorescue.fullname" . }}
  labels:
    {{- include "mongorescue.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mongorescue.selectorLabels" . | nindent 4 }}
---
# Governing service of the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongorescue.fullname" . }}-headless
  labels:
    {{- include "mongorescue.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mongorescue.selectorLabels" . | nindent 4 }}
