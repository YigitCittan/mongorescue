apiVersion: v1
kind: Pod
metadata:
  name: {{ include "mongorescue.fullname" . }}-test-health
  labels:
    {{- include "mongorescue.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      # The MongoRescue image ships busybox wget.
      image: {{ include "mongorescue.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["wget", "-qO-", "http://{{ include "mongorescue.fullname" . }}:{{ .Values.service.port }}/api/v1/health"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        limits:
          memory: 32Mi
