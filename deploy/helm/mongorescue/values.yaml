# Default values for the MongoRescue chart. See docs/kubernetes.md.
#
# MongoRescue is a single process with a locked data directory: the StatefulSet
# always runs one replica. Everything except the bootstrap options below
# (connections, storage targets, schedules, encryption, users) is configured in the
# dashboard or the REST API and stored in the database on the data volume.

image:
  repository: ghcr.io/yigitcittan/mongorescue
  # Defaults to the chart's appVersion.
  tag: ""
  # Pin an image digest ("sha256:...") for reproducible deployments; it takes
  # precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Bootstrap options (see docs/configuration.md#bootstrap-options).
config:
  # Serve the embedded web dashboard at "/". The REST API, MCP and metrics work
  # without it.
  dashboard: true
  # debug, info, warn or error.
  logLevel: info
  # text or json (-log-format, MONGORESCUE_LOG_FORMAT): json is one object per line,
  # for Loki, ELK and CloudWatch.
  logFormat: text
  # Log one line per HTTP request (-access-log): method, route, status, duration,
  # bytes, client address and request ID; never the query string or a body.
  accessLog: false
  # How long a shutdown (pod deletion, rolling update, node drain) waits for running
  # backups and restores before it cancels them (MONGORESCUE_SHUTDOWN_GRACE). Empty
  # derives it from terminationGracePeriodSeconds minus 60 seconds, which MongoRescue
  # needs to cancel the runs left, remove their partial archives and stop.
  shutdownGrace: ""
  # Directory searched first for mongodump and mongorestore (MONGORESCUE_TOOLS_DIR);
  # empty uses the tools bundled in the image.
  toolsDir: ""
  # Derive GOMEMLIMIT, the Go runtime's soft memory limit, from resources.limits.memory:
  # a number between 0 and 1 (0.7 sets 70% of the limit, in bytes, at render time; 0
  # leaves it off). Leave room below the limit: mongodump and mongorestore inherit
  # the variable and run in the same container. Needs resources.limits.memory; an
  # extraEnv entry named GOMEMLIMIT takes precedence. See docs/production.md#sizing.
  goMemLimitRatio: 0

# The key encrypting stored credentials (connection strings, S3 keys, notification
# secrets, the age identity) in the database. LOSING IT MAKES THEM UNRECOVERABLE.
secretKey:
  # Name of an existing Secret holding the key (base64 of 32 random bytes, e.g.
  # `openssl rand -base64 32`). Recommended: create it from your secret manager.
  existingSecret: ""
  # Key inside existingSecret (and inside the generated Secret).
  existingSecretKey: secret-key
  # Without existingSecret: generate a random key into a Secret named
  # <fullname>-secret-key. The Secret is kept on `helm uninstall` and reused on
  # upgrades; back it up (or download the recovery kit) right after the install.
  # false stores the key as secret.key on the data volume instead.
  generate: true
  # GitOps-safe mode (Argo CD, kustomize helmCharts, helm template): the chart
  # refuses to render unless existingSecret or keyWrap is set. The generated key
  # relies on `lookup`, which is empty without cluster access, so it would change
  # at every render and the GitOps tool would overwrite the Secret. Off by default
  # (a first install, --dry-run and helm lint also have no lookup). See
  # docs/kubernetes.md#gitops-argo-cd-kustomize-helmcharts.
  requireExternal: false

# Wrap secret.key with an external KMS instead of keeping it in a Secret
# (MONGORESCUE_KEY_WRAP, docs/security.md#wrapping-secretkey-with-a-kms):
# "<provider>:<key URI>", for example
#   aws-kms:arn:aws:kms:eu-central-1:123456789012:alias/mongorescue
#   gcp-kms:projects/p/locations/europe-west1/keyRings/r/cryptoKeys/mongorescue
#   azure-keyvault:https://my-vault.vault.azure.net/keys/mongorescue
#   vault-transit:https://vault.vault.svc:8200/transit/keys/mongorescue
# The data volume then holds only secret.key.wrapped, unwrapped at every start
# with the pod's identity: IRSA or EKS Pod Identity, GKE Workload Identity, Azure
# Workload Identity (serviceAccount.annotations, podLabels), or Vault's Kubernetes
# auth (extraEnv VAULT_K8S_ROLE and serviceAccount.automountServiceAccountToken:
# true). See docs/kubernetes.md. With keyWrap set, secretKey.generate is ignored
# and secretKey.existingSecret must be empty.
keyWrap: ""

# Active-passive high availability (docs/production.md#high-availability). Run a
# second release with the same values (and its own data volume): the instance
# holding the lease on the HA storage target runs schedules and PITR collection,
# the other waits as a read-only standby and takes over when the lease expires.
# Both releases need the same secret key: set secretKey.existingSecret to one
# Secret shared by them, or with keyWrap copy secret.key.wrapped of the first
# release into the data volume of the second. replicas stays 1 per release.
ha:
  enabled: false
  # The storage target of the lease and the metadata handover. Prefer a location
  # URL, which a fresh standby can use before it has any metadata:
  # s3://bucket/prefix?endpoint=https://minio:9000&region=us-east-1&path_style=true
  # (credentials from the AWS default chain: extraEnv AWS_* or IRSA). A target
  # ID or name must already exist in the instance's own database.
  target: ""
  # The cluster name, the same in both releases.
  cluster: default
  leaseTTL: 30s
  # Below half the lease TTL.
  renewInterval: 10s
  snapshotInterval: 5m
  # Opt-in: the readiness probe asks GET /api/v1/ready instead of /api/v1/health, so
  # only the ACTIVE instance (not draining, database writable, disk not full) is
  # Ready. A Service or load balancer that routes by readiness then follows a
  # failover without a change. Liveness and startup keep /api/v1/health: a standby
  # is alive, just not Ready. Consequence: the standby release never becomes Ready,
  # so do not `helm upgrade --wait` it (and its own Service, Ingress and NetworkPolicy
  # peers have no endpoint until it is active). Needs ha.enabled.
  readinessActiveOnly: false
  # Optional Service across the pods of both releases (they carry the label
  # mongorescue.io/ha-cluster=<cluster>). Enable it in ONE release only, in the
  # namespace of both. With readinessActiveOnly it always selects the active
  # instance; without it, both answer and the Service balances over the standby too.
  sharedService:
    enabled: false
    # Empty is mongorescue-<cluster>.
    name: ""
    type: ClusterIP
    port: 8080
    annotations: {}
  # Spread the two releases over nodes or zones (see topologySpreadConstraints and
  # affinity below): two pods on one node fail together, which defeats HA. Both
  # releases carry the label mongorescue.io/ha-cluster=<cluster>:
  #
  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - topologyKey: kubernetes.io/hostname
  #         labelSelector:
  #           matchLabels:
  #             mongorescue.io/ha-cluster: default
  #
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway
  #     labelSelector:
  #       matchLabels:
  #         mongorescue.io/ha-cluster: default

# Grace period of the pod. A rolling update or a node drain waits this long for
# running backups and restores (see config.shutdownGrace) before the pod is killed.
terminationGracePeriodSeconds: 600

# Extra environment variables and sources for the container (e.g. AWS_* for the
# default credential chain of S3 targets, or proxy settings).
extraEnv: []
#  - name: AWS_REGION
#    value: eu-central-1
extraEnvFrom: []
#  - secretRef:
#      name: mongorescue-aws

# The data directory: mongorescue.db, secret.key (unless secretKey is set), the
# instance lock and the run logs.
persistence:
  enabled: true
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  annotations: {}
  # Use an existing PersistentVolumeClaim instead of the StatefulSet's claim template.
  existingClaim: ""

# The default "Local disk" storage target at /backups. For production prefer an S3
# target (Settings → Storage): archives on a volume next to MongoRescue share its
# failure domain. Disabled, /backups is an emptyDir and its archives are lost with
# the pod.
backups:
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}
    existingClaim: ""

# Scratch space for temporary files; the root filesystem is read-only.
tmp:
  sizeLimit: 256Mi

# The short-lived files that pass connection strings and TLS material (CA,
# client certificate and key, key password) to mongodump and mongorestore: a
# separate emptyDir mounted at /run/mongorescue-tmp (MONGORESCUE_TMP_DIR).
# medium: Memory keeps them in RAM (tmpfs), so credentials never reach a node's
# disk; the files are a few KiB per running backup or restore and count against
# the memory limit. Set medium to "" for a disk-backed emptyDir.
credentialsTmp:
  medium: Memory
  sizeLimit: 16Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # mongodump and mongorestore run inside this container. Each S3 upload buffers
    # its part size × 2 (32 MiB by default); add that per concurrent backup. Size
    # it for the busiest moment (docs/production.md#sizing): an OOMKill shows up as
    # a failed backup. config.goMemLimitRatio derives GOMEMLIMIT from this limit.
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # MongoRescue does not call the Kubernetes API.
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# See the examples under ha: spread the HA releases over nodes and zones.
topologySpreadConstraints: []
priorityClassName: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Probes on GET /api/v1/health (public). It answers 503 when the scheduler is stale
# (its last tick is older than 90 seconds), so liveness restarts a hung process; it
# stays 200 while a shutdown waits for running backups, and on an HA standby. The
# startup probe allows database migrations on the first start of a new release.
# The readiness probe asks the same endpoint unless ha.readinessActiveOnly is set
# (then GET /api/v1/ready).
probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 3
    # 120 × 5 s = 10 minutes.
    failureThreshold: 120
  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

ingress:
  enabled: false
  className: ""
  annotations: {}
  #  nginx.ingress.kubernetes.io/proxy-body-size: 16m
  hosts:
    - host: mongorescue.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: mongorescue-tls
  #    hosts:
  #      - mongorescue.example.com

networkPolicy:
  enabled: false
  # Who may reach the HTTP port (dashboard, API, metrics), as NetworkPolicy peers;
  # empty allows every pod and namespace. Add your ingress controller and
  # Prometheus here.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # Where MongoRescue may connect, as NetworkPolicy egress rules: DNS is always
  # allowed. Empty allows every destination (MongoDB servers, S3, notification
  # webhooks, SSO); narrow it to your MongoDB pods, S3 endpoint and webhook hosts.
  egressTo: []
  #  - to:
  #      - podSelector:
  #          matchLabels:
  #            app.kubernetes.io/name: mongodb
  #    ports:
  #      - port: 27017
  #  - to:
  #      - ipBlock:
  #          cidr: 0.0.0.0/0
  #    ports:
  #      - port: 443

# Prometheus Operator integration. /metrics needs an API key unless Settings →
# Security → Public metrics is on.
serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}
  # Secret holding an API key (read scope) sent as a bearer token.
  authorization:
    secretName: ""
    secretKey: api-key
  # Prometheus' default honor_labels: false keeps MongoRescue's job label as
  # exported_job; the shipped rules work either way.
  honorLabels: false

# The alert rules of deploy/prometheus/alerts.yml as a PrometheusRule.
prometheusRule:
  enabled: false
  labels: {}

# The Grafana dashboard of deploy/grafana/mongorescue.json (Grafana 10+) as a
# ConfigMap that the Grafana sidecar of kube-prometheus-stack or the Grafana chart
# imports: it looks for ConfigMaps with the label below in every namespace it
# watches (sidecar.dashboards.searchNamespace). Off by default.
grafana:
  dashboard:
    enabled: false
    # The label the sidecar selects on (sidecar.dashboards.label, default
    # grafana_dashboard with the value "1").
    labels:
      grafana_dashboard: "1"
    # For example grafana_folder: MongoRescue (sidecar.dashboards.folderAnnotation).
    annotations: {}

# Extra volumes and mounts, e.g. a CA bundle for MongoDB TLS.
extraVolumes: []
extraVolumeMounts: []
