# Unit tests of alerts.yml: promtool test rules deploy/prometheus/alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: instance down
    interval: 1m
    input_series:
      - series: 'up{job="mongorescue", instance="mr:8080"}'
        values: "1 1 0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: MongoRescueDown
        exp_alerts: []
      - eval_time: 8m
        alertname: MongoRescueDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: mongorescue
              instance: mr:8080
            exp_annotations:
              summary: "MongoRescue on mr:8080 is down"
              description: "Prometheus has not been able to scrape MongoRescue on mr:8080 for 5 minutes. No backups run while it is down."

  - name: scheduler stale
    interval: 1m
    input_series:
      # Ticks until 5m, then the scheduler hangs.
      - series: 'mongorescue_scheduler_last_tick_timestamp_seconds{job="mongorescue", instance="mr:8080"}'
        values: "0+60x5 300x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: MongoRescueSchedulerStale
        exp_alerts: []
      - eval_time: 10m
        alertname: MongoRescueSchedulerStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: mongorescue
              instance: mr:8080
            exp_annotations:
              summary: "The MongoRescue scheduler on mr:8080 is stale"
              description: "The scheduler has not ticked for 5m 0s. Scheduled backups do not start; restart MongoRescue."

  - name: backup failures
    interval: 1m
    input_series:
      - series: 'mongorescue_backups_total{job="nightly", status="failed", instance="mr:8080"}'
        values: "0 0 1 1 1"
      - series: 'mongorescue_backups_total{job="nightly", status="succeeded", instance="mr:8080"}'
        values: "0 1 2 3 4"
      - series: 'mongorescue_backups_total{job="healthy", status="failed", instance="mr:8080"}'
        values: "0 0 0 0 0"
      # A multi-database run whose databases could not be listed.
      - series: 'mongorescue_job_runs_total{job="multi", status="failed", instance="mr:8080"}'
        values: "0 0 0 1 1"
      - series: 'mongorescue_job_runs_total{job="multi", status="ok", instance="mr:8080"}'
        values: "0 1 1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: MongoRescueBackupFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: MongoRescueBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: nightly
              instance: mr:8080
            exp_annotations:
              summary: "A backup of MongoRescue job nightly failed"
              description: "Job nightly on mr:8080 had a failed backup or run in the last hour. See its run log in the dashboard."
          - exp_labels:
              severity: warning
              job: multi
              instance: mr:8080
            exp_annotations:
              summary: "A backup of MongoRescue job multi failed"
              description: "Job multi on mr:8080 had a failed backup or run in the last hour. See its run log in the dashboard."

  - name: rpo missed
    interval: 1m
    input_series:
      - series: 'mongorescue_job_rpo_met{job="nightly", database="shop", instance="mr:8080"}'
        values: "1 1 0x10"
      - series: 'mongorescue_job_rpo_met{job="nightly", database="crm", instance="mr:8080"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 4m
        alertname: MongoRescueRPOMissed
        exp_alerts: []
      - eval_time: 8m
        alertname: MongoRescueRPOMissed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: nightly
              database: shop
              instance: mr:8080
            exp_annotations:
              summary: "Job nightly: shop is past its recovery point objective"
              description: "The newest successful backup of shop (job nightly on mr:8080) is older than the job's recovery point objective."

  - name: integrity sweep failures
    interval: 1m
    input_series:
      - series: 'mongorescue_verifications_total{source="sweep", result="mismatch", job="mongorescue", instance="mr:8080"}'
        values: "0 0 1 1"
      - series: 'mongorescue_verifications_total{source="sweep", result="ok", job="mongorescue", instance="mr:8080"}'
        values: "0 5 10 15"
      - series: 'mongorescue_verifications_total{source="after_upload", result="error", job="mongorescue", instance="mr:8080"}'
        values: "0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: MongoRescueVerificationFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              source: sweep
              result: mismatch
              instance: mr:8080
            exp_annotations:
              summary: "A MongoRescue archive verification failed (sweep: mismatch)"
              description: "A sweep verification on mr:8080 found an archive that does not match its checksum or cannot be read. Check the integrity page of the dashboard."

  - name: missing archives
    interval: 1m
    input_series:
      - series: 'mongorescue_storage_missing_archives{target="s3-prod", job="mongorescue", instance="mr:8080"}'
        values: "0 0 2"
      - series: 'mongorescue_storage_missing_archives{target="local", job="mongorescue", instance="mr:8080"}'
        values: "0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: MongoRescueArchivesMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: MongoRescueArchivesMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              target: s3-prod
              job: mongorescue
              instance: mr:8080
            exp_annotations:
              summary: "2 backup archives are missing from storage target s3-prod"
              description: "The last storage scan of target s3-prod on mr:8080 did not find the archives of 2 backup records."

  - name: restore test failures
    interval: 1m
    input_series:
      # The first restore test of a job fails: the series starts at 1.
      - series: 'mongorescue_restore_tests_total{job="nightly", result="error", instance="mr:8080"}'
        values: "_ _ 1 1"
      # A later restore test of another job finds differences.
      - series: 'mongorescue_restore_tests_total{job="weekly", result="mismatch", instance="mr:8080"}'
        values: "0 0 1 1"
      - series: 'mongorescue_restore_tests_total{job="weekly", result="ok", instance="mr:8080"}'
        values: "1 1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: MongoRescueRestoreTestFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: MongoRescueRestoreTestFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: nightly
              result: error
              instance: mr:8080
            exp_annotations:
              summary: "A restore test of MongoRescue job nightly failed (error)"
              description: "An automated restore test of job nightly on mr:8080 ended with error in the last 24 hours."
          - exp_labels:
              severity: warning
              job: weekly
              result: mismatch
              instance: mr:8080
            exp_annotations:
              summary: "A restore test of MongoRescue job weekly failed (mismatch)"
              description: "An automated restore test of job weekly on mr:8080 ended with mismatch in the last 24 hours."

  - name: metadata backup failures
    interval: 1m
    input_series:
      - series: 'mongorescue_metadata_backups_total{result="error", job="mongorescue", instance="mr:8080"}'
        values: "0 0 1"
      - series: 'mongorescue_metadata_backups_total{result="ok", job="mongorescue", instance="mr:8080"}'
        values: "0 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: MongoRescueMetadataBackupFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: MongoRescueMetadataBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              result: error
              job: mongorescue
              instance: mr:8080
            exp_annotations:
              summary: "A MongoRescue metadata backup failed on mr:8080"
              description: "A scheduled snapshot of the metadata database (jobs, backup records, users, settings) could not be written to its storage target in the last 24 hours."

  - name: settings warnings
    interval: 1m
    input_series:
      - series: 'mongorescue_settings_warnings{job="mongorescue", instance="mr:8080"}'
        values: "0 1x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: MongoRescueSettingsWarning
        exp_alerts: []
      - eval_time: 70m
        alertname: MongoRescueSettingsWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mongorescue
              instance: mr:8080
            exp_annotations:
              summary: "MongoRescue on mr:8080 has 1 active settings warnings"
              description: "Open the dashboard: the warning banner names the setting that resolves each warning."
