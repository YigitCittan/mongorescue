# Unit tests of alerts.yml: promtool test rules deploy/prometheus/alerts_test.yml
#
# The series look like a default scrape configuration (honor_labels: false) with a
# scrape job called "backup": per-job series carry the MongoRescue job ID in
# exported_job. A few series on the instance "honor:8080" look like a scrape with
# honor_labels: true, where the job ID stays in job.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: instance down
    interval: 1m
    input_series:
      - series: 'up{job="backup", instance="mr:8080"}'
        values: "1 1 0x10"
      # The last scrape exposed MongoRescue metrics; the failed ones expose none.
      - series: 'mongorescue_build_info{job="backup", instance="mr:8080", version="v1.0.0", commit="abc", go_version="go1.26"}'
        values: "1 1"
      # Another target that is down but is not MongoRescue.
      - series: 'up{job="node", instance="other:9100"}'
        values: "0x12"
    alert_rule_test:
      - eval_time: 5m
        alertname: MongoRescueDown
        exp_alerts: []
      - eval_time: 8m
        alertname: MongoRescueDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "MongoRescue on mr:8080 is down"
              description: "Prometheus has not been able to scrape MongoRescue on mr:8080 for 5 minutes. No backups run while it is down."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuedown"

  - name: scheduler stale
    interval: 1m
    input_series:
      # Ticks until 5m, then the scheduler hangs.
      - series: 'mongorescue_scheduler_last_tick_timestamp_seconds{job="backup", instance="mr:8080"}'
        values: "60+60x4 300x10"
      # A scheduler that has not started reports 0: never stale.
      - series: 'mongorescue_scheduler_last_tick_timestamp_seconds{job="backup", instance="starting:8080"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 5m
        alertname: MongoRescueSchedulerStale
        exp_alerts: []
      - eval_time: 10m
        alertname: MongoRescueSchedulerStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "The MongoRescue scheduler on mr:8080 is stale"
              description: "The scheduler has not ticked for 5m 0s. Scheduled backups do not start; restart MongoRescue."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueschedulerstale"

  - name: backup failures
    interval: 1m
    input_series:
      - series: 'mongorescue_backups_total{job="backup", exported_job="nightly", status="failed", instance="mr:8080"}'
        values: "0 0 1 1 1"
      - series: 'mongorescue_backups_total{job="backup", exported_job="nightly", status="succeeded", instance="mr:8080"}'
        values: "0 1 2 3 4"
      - series: 'mongorescue_backups_total{job="backup", exported_job="healthy", status="failed", instance="mr:8080"}'
        values: "0 0 0 0 0"
      # A multi-database run whose databases could not be listed (honor_labels: true).
      - series: 'mongorescue_job_runs_total{job="multi", status="failed", instance="honor:8080"}'
        values: "0 0 0 1 1"
      - series: 'mongorescue_job_runs_total{job="multi", status="ok", instance="honor:8080"}'
        values: "0 1 1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: MongoRescueBackupFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: MongoRescueBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              exported_job: nightly
              instance: mr:8080
            exp_annotations:
              summary: "A backup of MongoRescue job nightly failed"
              description: "Job nightly on mr:8080 had a failed backup or run in the last hour. See its run log in the dashboard."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuebackupfailed"
          - exp_labels:
              severity: warning
              job: multi
              instance: honor:8080
            exp_annotations:
              summary: "A backup of MongoRescue job multi failed"
              description: "Job multi on honor:8080 had a failed backup or run in the last hour. See its run log in the dashboard."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuebackupfailed"

  - name: rpo missed
    interval: 1m
    input_series:
      - series: 'mongorescue_job_rpo_met{job="backup", exported_job="nightly", database="shop", instance="mr:8080"}'
        values: "1 1 0x10"
      - series: 'mongorescue_job_rpo_met{job="backup", exported_job="nightly", database="crm", instance="mr:8080"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 4m
        alertname: MongoRescueRPOMissed
        exp_alerts: []
      - eval_time: 8m
        alertname: MongoRescueRPOMissed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              exported_job: nightly
              database: shop
              instance: mr:8080
            exp_annotations:
              summary: "Job nightly: shop is past its recovery point objective"
              description: "The newest successful backup of shop (job nightly on mr:8080) is older than the job's recovery point objective."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuerpomissed"

  - name: integrity sweep failures
    interval: 1m
    input_series:
      - series: 'mongorescue_verifications_total{source="sweep", result="mismatch", job="backup", instance="mr:8080"}'
        values: "0 0 1 1"
      - series: 'mongorescue_verifications_total{source="sweep", result="ok", job="backup", instance="mr:8080"}'
        values: "0 5 10 15"
      - series: 'mongorescue_verifications_total{source="after_upload", result="error", job="backup", instance="mr:8080"}'
        values: "0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: MongoRescueVerificationFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              source: sweep
              result: mismatch
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "A MongoRescue archive verification failed (sweep: mismatch)"
              description: "A sweep verification on mr:8080 found an archive that does not match its checksum or cannot be read. Check the integrity page of the dashboard."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueverificationfailed"

  - name: missing archives
    interval: 1m
    input_series:
      - series: 'mongorescue_storage_missing_archives{target="s3-prod", job="backup", instance="mr:8080"}'
        values: "0 0 2"
      - series: 'mongorescue_storage_missing_archives{target="local", job="backup", instance="mr:8080"}'
        values: "0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: MongoRescueArchivesMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: MongoRescueArchivesMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              target: s3-prod
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "2 backup archives are missing from storage target s3-prod"
              description: "The last storage scan of target s3-prod on mr:8080 did not find the archives of 2 backup records."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuearchivesmissing"

  - name: restore test failures
    interval: 1m
    input_series:
      # The first restore test of a job fails: the series starts at 1.
      - series: 'mongorescue_restore_tests_total{job="backup", exported_job="nightly", result="error", instance="mr:8080"}'
        values: "_ _ 1 1"
      # A later restore test of another job finds differences.
      - series: 'mongorescue_restore_tests_total{job="backup", exported_job="weekly", result="mismatch", instance="mr:8080"}'
        values: "0 0 1 1"
      - series: 'mongorescue_restore_tests_total{job="backup", exported_job="weekly", result="ok", instance="mr:8080"}'
        values: "1 1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: MongoRescueRestoreTestFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: MongoRescueRestoreTestFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              exported_job: nightly
              result: error
              instance: mr:8080
            exp_annotations:
              summary: "A restore test of MongoRescue job nightly failed (error)"
              description: "An automated restore test of job nightly on mr:8080 ended with error in the last 24 hours."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuerestoretestfailed"
          - exp_labels:
              severity: warning
              job: backup
              exported_job: weekly
              result: mismatch
              instance: mr:8080
            exp_annotations:
              summary: "A restore test of MongoRescue job weekly failed (mismatch)"
              description: "An automated restore test of job weekly on mr:8080 ended with mismatch in the last 24 hours."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuerestoretestfailed"

  - name: metadata backup failures
    interval: 1m
    input_series:
      - series: 'mongorescue_metadata_backups_total{result="error", job="backup", instance="mr:8080"}'
        values: "0 0 1"
      - series: 'mongorescue_metadata_backups_total{result="ok", job="backup", instance="mr:8080"}'
        values: "0 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: MongoRescueMetadataBackupFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: MongoRescueMetadataBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              result: error
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "A MongoRescue metadata backup failed on mr:8080"
              description: "A scheduled snapshot of the metadata database (jobs, backup records, users, settings) could not be written to its storage target in the last 24 hours."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuemetadatabackupfailed"

  - name: settings warnings
    interval: 1m
    input_series:
      - series: 'mongorescue_settings_warnings{job="backup", instance="mr:8080"}'
        values: "0 1x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: MongoRescueSettingsWarning
        exp_alerts: []
      - eval_time: 70m
        alertname: MongoRescueSettingsWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "MongoRescue on mr:8080 has 1 active settings warnings"
              description: "Open the dashboard: the warning banner names the setting that resolves each warning."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuesettingswarning"

  - name: HA cluster without an active instance
    interval: 1m
    input_series:
      # Member a is active until it dies after minute 4; member b takes over at
      # minute 10.
      - series: 'mongorescue_ha_role{job="backup", instance="a:8080", cluster="prod", role="active"}'
        values: "1 1 1 1 1 stale"
      - series: 'mongorescue_ha_role{job="backup", instance="a:8080", cluster="prod", role="standby"}'
        values: "0 0 0 0 0 stale"
      - series: 'mongorescue_ha_role{job="backup", instance="b:8080", cluster="prod", role="active"}'
        values: "0x9 1x5"
      - series: 'mongorescue_ha_role{job="backup", instance="b:8080", cluster="prod", role="standby"}'
        values: "1x9 0x5"
    alert_rule_test:
      - eval_time: 4m
        alertname: MongoRescueHANoActiveInstance
        exp_alerts: []
      - eval_time: 7m
        alertname: MongoRescueHANoActiveInstance
        exp_alerts:
          - exp_labels:
              severity: critical
              cluster: prod
            exp_annotations:
              summary: "No active instance in MongoRescue HA cluster prod"
              description: "No member of HA cluster prod holds the lease: scheduled backups and PITR collection do not run. Check mongorescue_ha_lease_healthy and the members' logs (lease storage reachable, same secret key, a usable metadata snapshot)."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuehanoactiveinstance"
      - eval_time: 11m
        alertname: MongoRescueHANoActiveInstance
        exp_alerts: []

  - name: HA takeover failed
    interval: 1m
    input_series:
      - series: 'mongorescue_ha_takeover_failures_total{job="backup", instance="b:8080", cluster="prod"}'
        values: "0 0 0 1 1 1x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: MongoRescueHATakeoverFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: MongoRescueHATakeoverFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: b:8080
              cluster: prod
            exp_annotations:
              summary: "A takeover failed in MongoRescue HA cluster prod on b:8080"
              description: "The standby b:8080 acquired the HA lease but found no usable metadata snapshot to take over from, so it stayed standby. Check the snapshots under _mongorescue/metadata/ha/prod/ on the HA target and the standby's logs."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuehatakeoverfailed"
      - eval_time: 25m
        alertname: MongoRescueHATakeoverFailed
        exp_alerts: []

  - name: HA started from empty state
    interval: 1m
    input_series:
      - series: 'mongorescue_ha_empty_starts_total{job="backup", instance="b:8080", cluster="prod"}'
        values: "0 0 0 1 1 1x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: MongoRescueHAStartedFromEmptyState
        exp_alerts: []
      - eval_time: 5m
        alertname: MongoRescueHAStartedFromEmptyState
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: b:8080
              cluster: prod
            exp_annotations:
              summary: "MongoRescue HA cluster prod started from empty state on b:8080"
              description: "b:8080 found no lease and no metadata snapshot for HA cluster prod and became active with its own database. If this was not a new cluster, check the HA target (were its objects deleted?) and run a storage scan of every storage target to re-import the archives."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuehastartedfromemptystate"
      - eval_time: 25m
        alertname: MongoRescueHAStartedFromEmptyState
        exp_alerts: []

  - name: HA rollback suspected
    interval: 1m
    input_series:
      - series: 'mongorescue_ha_rollback_suspected_total{job="backup", instance="b:8080", cluster="prod", reason="snapshot_behind_lease"}'
        values: "0 0 0 1 1 1x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: MongoRescueHARollbackSuspected
        exp_alerts: []
      - eval_time: 5m
        alertname: MongoRescueHARollbackSuspected
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: b:8080
              cluster: prod
              reason: snapshot_behind_lease
            exp_annotations:
              summary: "A takeover was refused as a suspected rollback in MongoRescue HA cluster prod on b:8080"
              description: "b:8080 refused to take over HA cluster prod (snapshot_behind_lease): restoring the snapshots left on the HA target could roll the metadata back. Check who can write to the HA target and what the log says, then run mongorescue ha force-takeover on the instance that should become active."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueharollbacksuspected"
      - eval_time: 25m
        alertname: MongoRescueHARollbackSuspected
        exp_alerts: []

  - name: HA snapshot rejected
    interval: 1m
    input_series:
      - series: 'mongorescue_ha_snapshots_rejected_total{job="backup", instance="b:8080", cluster="prod"}'
        values: "0 0 0 1 1 1x30"
      # The refused snapshot stays on the HA target for 40 minutes.
      - series: 'mongorescue_ha_refused_snapshots{job="backup", instance="b:8080", cluster="prod"}'
        values: "0 0 0 1x40 0x10"
    alert_rule_test:
      - eval_time: 2m
        alertname: MongoRescueHASnapshotRejected
        exp_alerts: []
      - eval_time: 5m
        alertname: MongoRescueHASnapshotRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: b:8080
              cluster: prod
            exp_annotations:
              summary: "A metadata snapshot was refused in MongoRescue HA cluster prod on b:8080"
              description: "b:8080 refused a metadata snapshot under _mongorescue/metadata/ha/prod/ whose authenticated header does not match its name or cluster, or that does not decrypt: it was copied, renamed or altered on the HA target. The log names the object. Check who can write to the HA target, rotate its credentials if needed, and remove the object."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuehasnapshotrejected"
      - eval_time: 25m
        alertname: MongoRescueHASnapshotRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: b:8080
              cluster: prod
            exp_annotations:
              summary: "A metadata snapshot was refused in MongoRescue HA cluster prod on b:8080"
              description: "b:8080 refused a metadata snapshot under _mongorescue/metadata/ha/prod/ whose authenticated header does not match its name or cluster, or that does not decrypt: it was copied, renamed or altered on the HA target. The log names the object. Check who can write to the HA target, rotate its credentials if needed, and remove the object."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuehasnapshotrejected"
      - eval_time: 50m
        alertname: MongoRescueHASnapshotRejected
        exp_alerts: []

  - name: PITR collector down
    interval: 1m
    input_series:
      - series: 'mongorescue_pitr_collector_up{job="backup", instance="mr:8080", stream="s1"}'
        values: "1 1 0x30"
      - series: 'mongorescue_pitr_collector_up{job="backup", instance="mr:8080", stream="s2"}'
        values: "1x32"
    alert_rule_test:
      - eval_time: 5m
        alertname: MongoRescuePITRCollectorDown
        exp_alerts: []
      - eval_time: 20m
        alertname: MongoRescuePITRCollectorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
              stream: s1
            exp_annotations:
              summary: "The PITR collector of stream s1 is down"
              description: "The oplog collector of PITR stream s1 on mr:8080 has stored no chunk for 10 minutes. Check the stream's collector error in the dashboard (connection, storage target, permissions)."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuepitrcollectordown"

  - name: PITR lag high
    interval: 1m
    input_series:
      - series: 'mongorescue_pitr_lag_seconds{job="backup", instance="mr:8080", stream="s1"}'
        values: "0 0 1000x40"
      - series: 'mongorescue_pitr_lag_seconds{job="backup", instance="mr:8080", stream="s2"}'
        values: "30x42"
    alert_rule_test:
      - eval_time: 8m
        alertname: MongoRescuePITRLagHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: MongoRescuePITRLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              stream: s1
            exp_annotations:
              summary: "PITR stream s1 is 16m 40s behind"
              description: "The collector of PITR stream s1 on mr:8080 has been more than 15 minutes behind the replica set for 10 minutes. Point-in-time restores cannot reach the newest writes; check the storage target's speed and the write load."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuepitrlaghigh"

  - name: PITR oplog headroom low
    interval: 1m
    input_series:
      # Below the 6 hour floor.
      - series: 'mongorescue_pitr_oplog_headroom_seconds{job="backup", instance="mr:8080", stream="floor"}'
        values: "86400 86400 10000x40"
      - series: 'mongorescue_pitr_lag_seconds{job="backup", instance="mr:8080", stream="floor"}'
        values: "10x42"
      # Above the floor but below 3 x the lag.
      - series: 'mongorescue_pitr_oplog_headroom_seconds{job="backup", instance="mr:8080", stream="lagging"}'
        values: "30000x42"
      - series: 'mongorescue_pitr_lag_seconds{job="backup", instance="mr:8080", stream="lagging"}'
        values: "20000x42"
      # Plenty of headroom.
      - series: 'mongorescue_pitr_oplog_headroom_seconds{job="backup", instance="mr:8080", stream="ok"}'
        values: "86400x42"
      - series: 'mongorescue_pitr_lag_seconds{job="backup", instance="mr:8080", stream="ok"}'
        values: "10x42"
    alert_rule_test:
      - eval_time: 8m
        alertname: MongoRescuePITROplogHeadroomLow
        exp_alerts: []
      - eval_time: 20m
        alertname: MongoRescuePITROplogHeadroomLow
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
              stream: floor
            exp_annotations:
              summary: "PITR stream floor has 2h 46m 40s of oplog headroom left"
              description: "The oplog of the replica set behind PITR stream floor (mr:8080) holds only 2h 46m 40s of entries before the collector's position. If the collector stops for that long, entries are lost and the recovery window breaks. Grow the oplog or fix the collector lag."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuepitroplogheadroomlow"
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
              stream: lagging
            exp_annotations:
              summary: "PITR stream lagging has 8h 20m 0s of oplog headroom left"
              description: "The oplog of the replica set behind PITR stream lagging (mr:8080) holds only 8h 20m 0s of entries before the collector's position. If the collector stops for that long, entries are lost and the recovery window breaks. Grow the oplog or fix the collector lag."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuepitroplogheadroomlow"

  - name: PITR chain broken
    interval: 1m
    input_series:
      # The first break of a stream: the series starts at 1.
      - series: 'mongorescue_pitr_chain_breaks_total{job="backup", instance="mr:8080", stream="s1", reason="gap"}'
        values: "_ _ 1x100"
      # A further break of a stream that broke before.
      - series: 'mongorescue_pitr_chain_breaks_total{job="backup", instance="mr:8080", stream="s2", reason="diverged"}'
        values: "5 5 5 6x100"
      # No break.
      - series: 'mongorescue_pitr_chain_breaks_total{job="backup", instance="mr:8080", stream="s3", reason="gap"}'
        values: "2x103"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongoRescuePITRChainBroken
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
              stream: s1
              reason: gap
            exp_annotations:
              summary: "The PITR chain of stream s1 broke (gap)"
              description: "The oplog chain of PITR stream s1 on mr:8080 ended (gap) in the last hour. Restores cannot cross the gap; a new base backup starts the next window."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuepitrchainbroken"
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
              stream: s2
              reason: diverged
            exp_annotations:
              summary: "The PITR chain of stream s2 broke (diverged)"
              description: "The oplog chain of PITR stream s2 on mr:8080 ended (diverged) in the last hour. Restores cannot cross the gap; a new base backup starts the next window."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuepitrchainbroken"
      - eval_time: 95m
        alertname: MongoRescuePITRChainBroken
        exp_alerts: []

  - name: PITR chunk errors
    interval: 1m
    input_series:
      - series: 'mongorescue_pitr_chunks_total{job="backup", instance="mr:8080", stream="s1", result="error"}'
        values: "0+1x30"
      - series: 'mongorescue_pitr_chunks_total{job="backup", instance="mr:8080", stream="s1", result="ok"}'
        values: "0+1x30"
      # One failed chunk is retried and does not alert.
      - series: 'mongorescue_pitr_chunks_total{job="backup", instance="mr:8080", stream="s2", result="error"}'
        values: "0 0 1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongoRescuePITRChunkErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              stream: s1
            exp_annotations:
              summary: "PITR stream s1 failed 10 chunks in the last hour"
              description: "The collector of PITR stream s1 on mr:8080 could not store several oplog chunks in the last hour (storage target or encryption errors). Nothing was kept for them; they are read again."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuepitrchunkerrors"

  - name: PITR stale
    interval: 1m
    input_series:
      # Writes continue (lag above a minute) but the last chunk is old.
      - series: 'mongorescue_pitr_last_chunk_timestamp_seconds{job="backup", instance="mr:8080", stream="s1"}'
        values: "1000x120"
      - series: 'mongorescue_pitr_lag_seconds{job="backup", instance="mr:8080", stream="s1"}'
        values: "120x120"
      # An idle replica set: old chunk, no lag.
      - series: 'mongorescue_pitr_last_chunk_timestamp_seconds{job="backup", instance="mr:8080", stream="idle"}'
        values: "1000x120"
      - series: 'mongorescue_pitr_lag_seconds{job="backup", instance="mr:8080", stream="idle"}'
        values: "0x120"
    alert_rule_test:
      - eval_time: 70m
        alertname: MongoRescuePITRStale
        exp_alerts: []
      - eval_time: 100m
        alertname: MongoRescuePITRStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              stream: s1
            exp_annotations:
              summary: "PITR stream s1 stored no chunk for 1h 23m 20s"
              description: "The newest chunk of PITR stream s1 on mr:8080 ends 1h 23m 20s ago while the replica set keeps writing."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuepitrstale"

  - name: backup copy failures
    interval: 1m
    input_series:
      - series: 'mongorescue_backup_copies_total{job="backup", instance="mr:8080", result="ok"}'
        values: "0+1x30"
      - series: 'mongorescue_backup_copies_total{job="backup", instance="mr:8080", result="error"}'
        values: "0 0 1x30"
      - series: 'mongorescue_backup_copies_total{job="backup", instance="mr:8080", result="mismatch"}'
        values: "0x2 1x30"
      - series: 'mongorescue_backup_copies_total{job="backup", instance="healthy:8080", result="error"}'
        values: "0x32"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongoRescueBackupCopyFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              result: error
            exp_annotations:
              summary: "A backup copy failed on mr:8080"
              description: "1 attempts to copy a backup to its copy target failed in the last hour. Failed copies are retried; check the copy target and the backup's copy status."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuebackupcopyfailed"
      - eval_time: 10m
        alertname: MongoRescueBackupCopyMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
              result: mismatch
            exp_annotations:
              summary: "A backup copy does not match its primary on mr:8080"
              description: "A copy stored on a copy target did not match the checksum of the primary archive in the last hour. The 3-2-1 guarantee does not hold for that backup; check the copy target."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuebackupcopymismatch"

  - name: backup copy queue growing
    interval: 1m
    input_series:
      # Never empty.
      - series: 'mongorescue_backup_copy_queue_depth{job="backup", instance="mr:8080"}'
        values: "3x400"
      # Drains once in a while.
      - series: 'mongorescue_backup_copy_queue_depth{job="backup", instance="busy:8080"}'
        values: "3x100 0 3x300"
    alert_rule_test:
      - eval_time: 3h
        alertname: MongoRescueBackupCopyQueueGrowing
        exp_alerts: []
      - eval_time: 270m
        alertname: MongoRescueBackupCopyQueueGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "The backup copy queue on mr:8080 has not been empty for 4 hours"
              description: "At least 3 backup copies waited in the queue at every moment of the last 4 hours. The copy target may be slow or unreachable, or backups outpace the copy bandwidth."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuebackupcopyqueuegrowing"

  - name: notification failures and losses
    interval: 1m
    input_series:
      # Every Slack delivery fails.
      - series: 'mongorescue_notifications_total{job="backup", instance="mr:8080", channel_type="slack", status="failure"}'
        values: "0+1x30"
      - series: 'mongorescue_notifications_total{job="backup", instance="mr:8080", channel_type="slack", status="success"}'
        values: "0x30"
      # A few email failures among many deliveries: no alert.
      - series: 'mongorescue_notifications_total{job="backup", instance="mr:8080", channel_type="email", status="failure"}'
        values: "0+1x30"
      - series: 'mongorescue_notifications_total{job="backup", instance="mr:8080", channel_type="email", status="success"}'
        values: "0+20x30"
      # Dropped webhook notifications.
      - series: 'mongorescue_notifications_total{job="backup", instance="mr:8080", channel_type="webhook", status="dropped"}'
        values: "0 0 4x30"
      - series: 'mongorescue_notifications_total{job="backup", instance="mr:8080", channel_type="webhook", status="expired"}'
        values: "0x32"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongoRescueNotificationFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              channel_type: slack
            exp_annotations:
              summary: "100% of slack notifications failed"
              description: "Notification deliveries through slack on mr:8080 are failing (given up after retries) in the last hour. Alerts may not reach you; test the channel in the dashboard."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuenotificationfailures"
      - eval_time: 10m
        alertname: MongoRescueNotificationsLost
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              channel_type: webhook
              status: dropped
            exp_annotations:
              summary: "webhook notifications were dropped"
              description: "4 webhook notifications on mr:8080 were dropped in the last 15 minutes and never delivered. The channel is slower than the event rate or unreachable."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuenotificationslost"

  - name: dropped events and heartbeats
    interval: 1m
    input_series:
      - series: 'mongorescue_events_dropped_total{job="backup", instance="mr:8080"}'
        values: "0 0 5x30"
      - series: 'mongorescue_heartbeat_dropped_total{job="backup", instance="mr:8080"}'
        values: "0 0 2x30"
      - series: 'mongorescue_events_dropped_total{job="backup", instance="healthy:8080"}'
        values: "0x32"
      - series: 'mongorescue_heartbeat_dropped_total{job="backup", instance="healthy:8080"}'
        values: "0x32"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongoRescueEventsDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "MongoRescue on mr:8080 dropped events"
              description: "5 events were dropped in the last 15 minutes because the event queue was full or stopped. Their notifications and metrics are missing."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueeventsdropped"
      - eval_time: 10m
        alertname: MongoRescueHeartbeatsDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "MongoRescue on mr:8080 dropped heartbeat pings"
              description: "2 job heartbeat pings were dropped in the last 15 minutes. The dead-man's-switch service may report a healthy job as missing; check its URL and latency."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueheartbeatsdropped"
      - eval_time: 40m
        alertname: MongoRescueEventsDropped
        exp_alerts: []

  - name: audit write and forward failures
    interval: 1m
    input_series:
      - series: 'mongorescue_audit_write_failures_total{job="backup", instance="mr:8080"}'
        values: "0 0 3x30"
      - series: 'mongorescue_audit_forward_total{job="backup", instance="mr:8080", outcome="failed"}'
        values: "0 0 4x30"
      - series: 'mongorescue_audit_forward_total{job="backup", instance="mr:8080", outcome="sent"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongoRescueAuditWriteFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "The audit log on mr:8080 could not store entries"
              description: "3 audit log entries could not be stored in the last 15 minutes (metadata database full, read-only or locked). Check free disk space and the log."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueauditwritefailed"
      - eval_time: 3m
        alertname: MongoRescueAuditForwardFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: MongoRescueAuditForwardFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              outcome: failed
            exp_annotations:
              summary: "Audit log forwarding failed on mr:8080"
              description: "4 audit entries could not be forwarded to the audit webhook (failed) in the last 15 minutes. The local log is intact; check the webhook."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueauditforwardfailed"

  - name: key wrap errors
    interval: 1m
    input_series:
      - series: 'mongorescue_key_wrap_errors_total{job="backup", instance="mr:8080", provider="aws-kms", operation="unwrap"}'
        values: "0 0 2x30"
      - series: 'mongorescue_key_wrap_errors_total{job="backup", instance="mr:8080", provider="aws-kms", operation="wrap"}'
        values: "0x32"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongoRescueKeyWrapErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              provider: aws-kms
              operation: unwrap
            exp_annotations:
              summary: "KMS unwrap calls to aws-kms fail"
              description: "2 unwrap calls to aws-kms failed in the last 15 minutes on mr:8080. MongoRescue cannot restart without unwrapping secret.key; check the KMS permissions and reachability."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuekeywraperrors"

  - name: API keys expired and expiring
    interval: 1m
    input_series:
      - series: 'mongorescue_api_keys_expired{job="backup", instance="mr:8080"}'
        values: "0 0 2x100"
      - series: 'mongorescue_api_keys_expiring{job="backup", instance="mr:8080"}'
        values: "1x102"
      - series: 'mongorescue_api_keys_expired{job="backup", instance="clean:8080"}'
        values: "0x102"
      - series: 'mongorescue_api_keys_expiring{job="backup", instance="clean:8080"}'
        values: "0x102"
    alert_rule_test:
      - eval_time: 30m
        alertname: MongoRescueAPIKeysExpired
        exp_alerts: []
      - eval_time: 90m
        alertname: MongoRescueAPIKeysExpired
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "2 MongoRescue API keys on mr:8080 have expired"
              description: "Expired API keys are refused. Rotate the keys of the scripts that use them and revoke the expired ones."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueapikeysexpired"
      - eval_time: 30m
        alertname: MongoRescueAPIKeysExpiring
        exp_alerts: []
      - eval_time: 90m
        alertname: MongoRescueAPIKeysExpiring
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "1 MongoRescue API keys on mr:8080 expire soon"
              description: "Create replacements and update the scripts, CI jobs and MCP clients that use these keys before they are refused."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescueapikeysexpiring"

  - name: disk filling up
    interval: 1m
    input_series:
      # The data directory loses 1 GB a minute.
      - series: 'mongorescue_data_dir_free_bytes{job="backup", instance="mr:8080"}'
        values: "100000000000-1000000000x90"
      # A local target that shrinks, and one that stays put.
      - series: 'mongorescue_storage_free_bytes{job="backup", instance="mr:8080", target="stg_fill"}'
        values: "100000000000-1000000000x90"
      - series: 'mongorescue_storage_free_bytes{job="backup", instance="mr:8080", target="stg_flat"}'
        values: "500000000000x90"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongoRescueDiskFillingUp
        exp_alerts: []
      - eval_time: 45m
        alertname: MongoRescueDiskFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
            exp_annotations:
              summary: "The data directory on mr:8080 fills up within 24 hours"
              description: "At the rate of the last 6 hours, the filesystem will have no free space in 24 hours (data directory). Free space, shorten retention or add capacity."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuediskfillingup"
          - exp_labels:
              severity: warning
              job: backup
              instance: mr:8080
              target: stg_fill
            exp_annotations:
              summary: "Storage target stg_fill on mr:8080 fills up within 24 hours"
              description: "At the rate of the last 6 hours, the filesystem will have no free space in 24 hours (local storage target stg_fill). Free space, shorten retention or add capacity."
              runbook_url: "https://yigitcittan.github.io/mongorescue/runbooks/#mongorescuediskfillingup"

  - name: standby instances fire no subsystem alert
    interval: 1m
    input_series:
      # A standby exposes only ha_*, build_info, go_* and process_* series.
      - series: 'mongorescue_ha_role{job="backup", instance="standby:8080", cluster="prod", role="standby"}'
        values: "1x120"
      - series: 'mongorescue_build_info{job="backup", instance="standby:8080", version="v1.0.0", commit="abc", go_version="go1.26"}'
        values: "1x120"
    alert_rule_test:
      - eval_time: 100m
        alertname: MongoRescuePITRCollectorDown
        exp_alerts: []
      - eval_time: 100m
        alertname: MongoRescuePITROplogHeadroomLow
        exp_alerts: []
      - eval_time: 100m
        alertname: MongoRescuePITRStale
        exp_alerts: []
      - eval_time: 100m
        alertname: MongoRescueBackupCopyQueueGrowing
        exp_alerts: []
      - eval_time: 100m
        alertname: MongoRescueNotificationFailures
        exp_alerts: []
      - eval_time: 100m
        alertname: MongoRescueAPIKeysExpired
        exp_alerts: []
      - eval_time: 100m
        alertname: MongoRescueDiskFillingUp
        exp_alerts: []
