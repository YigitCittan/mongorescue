components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mr_session
      description: Dashboard session set by POST /api/v1/setup, POST /api/v1/auth/login or single sign-on. Unsafe methods also need csrfToken.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The csrf_token of the session; required with sessionCookie on POST, PUT, PATCH and DELETE.
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key as Authorization: Bearer mr_<prefix>_<secret>. Needs no CSRF token.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key in the X-API-Key header. Needs no CSRF token.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    DatabaseName:
      name: db
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Sort:
      name: sort
      in: query
      required: false
      description: A column name, prefixed with - for descending order.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; the response then carries meta with total, limit and offset.
      schema:
        type: integer
        minimum: 1
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
  responses:
    Error:
      description: 'An error: the envelope with success false, an error text and a code.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: '400: the request is malformed or a parameter is invalid (invalid_request).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: '401: no valid credential (unauthorized, api_key_expired).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: '403: scope, role, connection access or CSRF refused the request (forbidden, approval_refused).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: '404: the record does not exist (not_found).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: '409: the request conflicts with the current state (conflict, busy, job_changed, protected, preflight_failed, sharded_unsupported).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ApprovalRequired:
      description: '202: with the two-person rule on, the action waits for a second administrator (code approval_required, data.approval).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          description: The payload; its shape depends on the route.
        error:
          type: string
          description: Human-readable error text; may change between releases. Present on errors.
        message:
          type: string
          description: Human-readable note, e.g. on a 202 waiting for approval.
        code:
          $ref: '#/components/schemas/ErrorCode'
      required:
        - success
    ErrorCode:
      type: string
      description: Stable machine-readable error code, the closed set of internal/apierr. Match it rather than the English error text. approval_required is the code of a 202 answer, not an error. GET /api/v1/ready answers 503 with its own ReadyCode instead.
      enum:
        - invalid_request
        - validation_failed
        - unauthorized
        - api_key_expired
        - forbidden
        - approval_refused
        - approval_required
        - not_found
        - conflict
        - busy
        - job_changed
        - protected
        - preflight_failed
        - sharded_unsupported
        - body_too_large
        - rate_limited
        - internal_error
        - bad_gateway
        - unavailable
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        data:
          description: Extra detail of some errors, e.g. the checks of a refused preflight.
      required:
        - success
        - error
        - code
    ReadyCode:
      type: string
      description: Why GET /api/v1/ready answers 503, in the order the reasons are checked.
      enum:
        - not_active
        - draining
        - store_unwritable
        - disk_full
    ReadyError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        code:
          $ref: '#/components/schemas/ReadyCode'
        data:
          $ref: '#/components/schemas/Ready'
      required:
        - success
        - error
        - code
        - data
    Ready:
      type: object
      properties:
        ready:
          type: boolean
        reason:
          $ref: '#/components/schemas/ReadyCode'
        role:
          type: string
          description: HA role; active outside HA mode.
        cluster:
          type: string
        version:
          type: string
      required:
        - ready
        - role
      additionalProperties: true
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        time:
          type: string
          format: date-time
        role:
          type: string
      required:
        - status
      additionalProperties: true
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required:
        - username
        - password
    SetupRequest:
      type: object
      properties:
        setup_code:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
      required:
        - username
        - password
    Session:
      type: object
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        csrf_token:
          type: string
          description: Send as X-CSRF-Token on unsafe requests of the session.
        auth:
          type: string
          description: session or api_key.
      additionalProperties: true
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - viewer
            - operator
            - admin
      required:
        - id
        - username
        - role
      additionalProperties: true
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum:
            - viewer
            - operator
            - admin
      required:
        - username
        - password
      additionalProperties: true
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
      required:
        - new_password
    RoleRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - viewer
            - operator
            - admin
      required:
        - role
      additionalProperties: true
    CreateAPIKeyRequest:
      type: object
      properties:
        name:
          type: string
        scope:
          type: string
          enum:
            - read
            - operator
            - admin
        expires_at:
          type: string
          format: date-time
      required:
        - name
      additionalProperties: true
    BackupStatus:
      type: string
      enum:
        - pending
        - in_progress
        - completed
        - failed
        - pruned
        - cancelled
        - skipped
        - missing
        - deleted
        - purged
    StorageType:
      type: string
      enum:
        - local
        - s3
    Backup:
      type: object
      properties:
        id:
          type: string
        job_id:
          type: string
        run_id:
          type: string
        trigger:
          type: string
          enum:
            - scheduled
            - on_demand
            - manual
            - mcp
        database:
          type: string
        connection_id:
          type: string
        connection_name:
          type: string
        status:
          $ref: '#/components/schemas/BackupStatus'
        storage_type:
          $ref: '#/components/schemas/StorageType'
        storage_target_id:
          type: string
        storage_key:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
        encrypted:
          type: boolean
        collections:
          type: array
          items:
            type: string
        exclude_collections:
          type: array
          items:
            type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration_seconds:
          type: number
        error_message:
          type: string
        warnings:
          type: array
          items:
            type: string
        retry_of:
          type: string
        label:
          type: string
        pinned:
          type: boolean
        verified_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        purge_after:
          type: string
          format: date-time
      required:
        - id
        - database
        - status
        - storage_type
        - storage_key
        - size_bytes
        - started_at
      additionalProperties: true
    StartBackupRequest:
      type: object
      properties:
        database:
          type: string
        connection_id:
          type: string
        storage_target_id:
          type: string
        collections:
          type: array
          items:
            type: string
        exclude_collections:
          type: array
          items:
            type: string
        gzip:
          type: boolean
        include_users_and_roles:
          type: boolean
        copy_targets:
          type: array
          items:
            type: string
        label:
          type: string
      required:
        - connection_id
      additionalProperties: true
    RestoreRequest:
      type: object
      properties:
        backup_id:
          type: string
        target_database:
          type: string
        safe_clone:
          type: boolean
          description: Restore into <db>_rescue_<timestamp>; the default of user-facing flows.
        confirm_in_place:
          type: boolean
        drop_target:
          type: boolean
        selected_collections:
          type: array
          items:
            type: string
        dry_run:
          type: boolean
        restore_users_and_roles:
          type: boolean
        target_connection_id:
          type: string
        verify:
          type: boolean
        force:
          type: boolean
        pitr:
          type: object
          properties:
            stream_id:
              type: string
            at:
              type: string
              format: date-time
            in_place:
              type: boolean
            confirm_in_place:
              type: boolean
            keep_clone:
              type: boolean
          required:
            - stream_id
          additionalProperties: true
      additionalProperties: true
    BulkRequest:
      type: object
      properties:
        action:
          type: string
        ids:
          type: array
          items:
            type: string
        filter:
          type: object
          additionalProperties: true
        dry_run:
          type: boolean
        confirm_count:
          type: integer
        note:
          type: string
      required:
        - action
      additionalProperties: true
    RetentionPolicy:
      type: object
      description: Retention rules of a copy target; at least one must be non-zero. A backup is kept while any rule keeps it.
      properties:
        retention_days:
          type: integer
          minimum: 0
        retention_count:
          type: integer
          minimum: 0
        keep_daily:
          type: integer
          minimum: 0
          maximum: 400
        keep_weekly:
          type: integer
          minimum: 0
          maximum: 520
        keep_monthly:
          type: integer
          minimum: 0
          maximum: 240
        keep_yearly:
          type: integer
          minimum: 0
          maximum: 100
      additionalProperties: false
    Job:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cron_expression:
          type: string
        database:
          type: string
        connection_id:
          type: string
        database_selection:
          type: object
          additionalProperties: true
        collections:
          type: array
          items:
            type: string
        exclude_collections:
          type: array
          items:
            type: string
        storage_type:
          $ref: '#/components/schemas/StorageType'
        storage_target_id:
          type: string
        retention_days:
          type: integer
          description: Keep backups for this many days (0 = no age limit).
        retention_count:
          type: integer
          description: Keep the newest N backups of each database (0 = no count limit).
        keep_daily:
          type: integer
          minimum: 0
          maximum: 400
          description: Also keep the newest backup of each of the last N days that have one (0 = off), per database, in the zone of the schedule (CRON_TZ=, else UTC).
        keep_weekly:
          type: integer
          minimum: 0
          maximum: 520
          description: Also keep the newest backup of each of the last N ISO weeks that have one (0 = off).
        keep_monthly:
          type: integer
          minimum: 0
          maximum: 240
          description: Also keep the newest backup of each of the last N months that have one (0 = off).
        keep_yearly:
          type: integer
          minimum: 0
          maximum: 100
          description: Also keep the newest backup of each of the last N years that have one (0 = off).
        copy_retention:
          type: object
          description: 'Per copy target retention, keyed by the ID of one of copy_targets. A copy whose target has an entry outlives its primary while the entry keeps the backup; copies without an entry are deleted with their primary.'
          additionalProperties:
            $ref: '#/components/schemas/RetentionPolicy'
        enabled:
          type: boolean
      required:
        - name
        - cron_expression
      additionalProperties: true
    Connection:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        uri:
          type: string
          description: Write-only credential-bearing URI; responses mask the password.
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_test_at:
          type: string
          format: date-time
        last_test_ok:
          type: boolean
        server_version:
          type: string
      required:
        - name
      additionalProperties: true
    StorageTarget:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/StorageType'
        is_default:
          type: boolean
        local:
          type: object
          additionalProperties: true
        s3:
          type: object
          additionalProperties: true
          description: Secret keys are write-only; responses mask them. ca_pem is an optional PEM bundle of certificate authorities trusted for the endpoint of this target in addition to the system roots; it is not secret and is returned as stored.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_test_at:
          type: string
          format: date-time
        last_test_ok:
          type: boolean
        pricing:
          $ref: '#/components/schemas/StoragePricing'
      required:
        - name
        - type
      additionalProperties: true
    StoragePricing:
      type: object
      description: The price entered for a target, for the cost estimate. Configuration, not a secret. On a save, omit it to keep the stored price and send an empty object to remove it.
      properties:
        currency:
          type: string
          description: ISO 4217 code of both prices, three letters (USD, EUR).
          example: USD
        storage_per_gib_month:
          type: number
          minimum: 0
          description: Price of keeping one GiB (2^30 bytes) for a month.
        egress_per_gib:
          type: number
          minimum: 0
          description: Price of reading one GiB back out of the target.
      required:
        - currency
        - storage_per_gib_month
        - egress_per_gib
    StorageUsage:
      type: object
      description: Stored size and estimated cost and egress per storage target.
      properties:
        generated_at:
          type: string
          format: date-time
        days:
          type: integer
        from:
          type: string
          description: First UTC day of the range (YYYY-MM-DD).
        to:
          type: string
          description: Last UTC day of the range (YYYY-MM-DD).
        targets:
          type: array
          items:
            $ref: '#/components/schemas/StorageTargetUsage'
        totals:
          type: array
          description: Costs of the priced targets, per currency.
          items:
            type: object
            properties:
              code:
                type: string
              monthly_cost:
                type: number
              egress_cost:
                type: number
        jobs:
          type: array
          description: The largest jobs now (backups and copies, not PITR), biggest first.
          items:
            $ref: '#/components/schemas/StorageConsumer'
        databases:
          type: array
          description: The largest databases now (backups and copies, not PITR), biggest first.
          items:
            $ref: '#/components/schemas/StorageConsumer'
        basis:
          type: string
          description: What the estimate is and is not.
      required:
        - targets
        - totals
        - jobs
        - databases
        - basis
    StorageTargetUsage:
      type: object
      properties:
        target_id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/StorageType'
        stored_bytes:
          type: integer
          format: int64
        objects:
          type: integer
          format: int64
        by_kind:
          type: object
          description: Stored bytes per kind (backup, copy, retained, pitr).
          additionalProperties:
            type: integer
            format: int64
        growth_bytes:
          type: integer
          format: int64
          description: Latest snapshot minus the earliest one of the range.
        pricing:
          $ref: '#/components/schemas/StoragePricing'
        monthly_cost:
          type: number
          description: Estimated cost of keeping stored_bytes for a month, in the currency of pricing; absent without a price.
        egress:
          type: object
          properties:
            bytes:
              type: integer
              format: int64
            by_source:
              type: object
              description: Bytes read back per source (verification, copy, restore_test). A lower bound, since only the last verification of an archive is recorded.
              additionalProperties:
                type: integer
                format: int64
            cost:
              type: number
              description: Estimated egress cost in the currency of pricing; absent without a price.
        history:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              bytes:
                type: integer
                format: int64
    StorageConsumer:
      type: object
      properties:
        job_id:
          type: string
        database:
          type: string
        bytes:
          type: integer
          format: int64
        objects:
          type: integer
          format: int64
    BackupList:
      type: array
      items:
        $ref: '#/components/schemas/Backup'
    JobList:
      type: array
      items:
        $ref: '#/components/schemas/Job'
    ConnectionList:
      type: array
      items:
        $ref: '#/components/schemas/Connection'
    StorageTargetList:
      type: array
      items:
        $ref: '#/components/schemas/StorageTarget'
security:
  - sessionCookie: []
    csrfToken: []
  - bearerAuth: []
  - apiKeyHeader: []
