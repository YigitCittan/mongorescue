site_name: MongoRescue
site_description: Stream, verify, and encrypt MongoDB backups with a single Go binary, built-in dashboard, point-in-time recovery, and S3 immutability.
site_author: Yigit Cittan
site_url: https://yigitcittan.github.io/mongorescue/

repo_name: YigitCittan/mongorescue
repo_url: https://github.com/YigitCittan/mongorescue
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Scheme mode: dark by default (preferred by devops / developers)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Scheme mode: light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Start:
      - Why MongoRescue: comparison.md
      - Feature Catalogue: features.md
      - First Backup from the CLI: getting-started-cli.md
      - MongoDB Connections: connections.md
      - Desktop Application: desktop.md
      - Kubernetes & Helm: kubernetes.md
      - Deployment Recipes: deployment-recipes.md
  - Operate:
      - Production Checklist: production.md
      - Upgrading & Rollback: upgrading.md
      - Point-in-Time Recovery (PITR): pitr.md
      - Verification & Testing: verification.md
      - Monitoring & Heartbeat: monitoring.md
      - Notifications & Alerts: notifications.md
      - Incident Runbooks: runbooks.md
      - Troubleshooting: troubleshooting.md
  - Secure:
      - Security & Key Wrapping: security.md
      - Threat Model: threat-model.md
      - Age Encryption: encryption.md
      - Single Sign-On (SSO): sso.md
      - Audit Logging: audit.md
      - Privacy & Retention: privacy.md
  - Integrate:
      - Command Line (CLI): cli.md
      - REST API Reference: api.md
      - OpenAPI Description: openapi.md
      - MCP Server (AI Integration): mcp.md
  - Reference:
      - Configuration: configuration.md
      - Prometheus Metrics: metrics.md
      - FAQ: faq.md
      - Glossary: glossary.md
      - Versioning Policy: versioning.md
      - Roadmap: roadmap.md
  - Design:
      - Architecture Overview: architecture.md
      - High Availability (Active-Passive): design/ha.md
      - PITR Storage & Codec Design: design/pitr.md
      - Roles & Permissions Design: design/roles.md
      - OIDC Architecture: design/oidc.md
      - Testing Strategy: testing.md
